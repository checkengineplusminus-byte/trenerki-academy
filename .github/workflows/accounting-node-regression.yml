name: TRENERKI accounting regression (read only)

on:
  push:
    branches: [main]
    paths:
      - "src/accounting/**"
      - "scripts/test-accounting-lab.mjs"
      - ".github/workflows/accounting-node-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/accounting/**"
      - "scripts/test-accounting-lab.mjs"
      - ".github/workflows/accounting-node-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting-tests:
    name: Accounting Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check accounting source syntax
        run: |
          find src/accounting -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --check scripts/test-accounting-lab.mjs
      - name: Run full accounting regression suite
        run: node --test --test-reporter=tap scripts/test-accounting-lab.mjs
