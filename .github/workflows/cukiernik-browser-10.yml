name: Cukiernik — 10 środowisk i kontrola merytoryczna
on:
  push:
    branches: [main]
    paths:
      - 'content/cukiernik-pro-20261117.json'
      - 'public/academy/assets/cukiernik-ilustracja-*.svg'
      - 'public/academy/kursy/lepszy-cukiernik.html'
      - 'public/academy/index.html'
      - 'src/LessonIllustratedSections.tsx'
      - 'scripts/test-cukiernik-quality.mjs'
      - 'scripts/cukiernik-browser-10.mjs'
      - '.github/workflows/cukiernik-browser-10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser_10_profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lesson material, homework, quiz, uniqueness and all original illustrations
        run: node scripts/test-cukiernik-quality.mjs
      - name: Install application and real browsers
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Export current production web bundle
        run: npx expo export --platform web --output-dir /tmp/trenerki-cukiernik-web
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: Check 10 real browser / screen profiles, lesson flow and images
        run: |
          python3 -m http.server 8787 --directory /tmp/trenerki-cukiernik-web >/tmp/trenerki-cukiernik-http.log 2>&1 &
          sleep 2
          node scripts/cukiernik-browser-10.mjs http://127.0.0.1:8787
