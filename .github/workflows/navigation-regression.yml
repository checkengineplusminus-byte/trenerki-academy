name: TRENERKI — profile and course navigation regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/konto.tsx'
      - 'app/moje-kursy.tsx'
      - 'app/ustawienia.tsx'
      - 'public/academy/course-share.js'
      - 'public/academy/course-share.css'
      - 'public/academy/academy-course-menu.v1.css'
      - 'src/AcademyDesktopNav.tsx'
      - 'scripts/version-public-navigation-assets.mjs'
      - 'public/academy/index.html'
      - 'public/academy/kursy/**'
      - 'public/academy/kategorie/**'
      - 'public/academy/ksiegowosc-od-podstaw.html'
      - 'scripts/test-navigation-consistency.mjs'
      - 'scripts/navigation-browser.mjs'
      - 'scripts/public-release-browser.mjs'
      - 'src/CourseReleaseNotice.tsx'
      - 'src/navigationAssets.json'
      - 'app/kup.tsx'
      - 'app/+html.tsx'
      - '.github/workflows/navigation-regression.yml'
  push:
    branches: [main]
    paths:
      - 'app/konto.tsx'
      - 'app/moje-kursy.tsx'
      - 'app/ustawienia.tsx'
      - 'public/academy/course-share.js'
      - 'public/academy/course-share.css'
      - 'public/academy/academy-course-menu.v1.css'
      - 'src/AcademyDesktopNav.tsx'
      - 'scripts/version-public-navigation-assets.mjs'
      - 'public/academy/index.html'
      - 'public/academy/kursy/**'
      - 'public/academy/kategorie/**'
      - 'public/academy/ksiegowosc-od-podstaw.html'
      - 'scripts/test-navigation-consistency.mjs'
      - 'scripts/navigation-browser.mjs'
      - 'scripts/public-release-browser.mjs'
      - 'src/CourseReleaseNotice.tsx'
      - 'src/navigationAssets.json'
      - 'app/kup.tsx'
      - 'app/+html.tsx'
      - '.github/workflows/navigation-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-navigation-consistency.mjs
  browser_navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Expo and Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Produce real web build
        run: |
          node scripts/generate-affiliate-short-pages.mjs
          node scripts/version-public-navigation-assets.mjs
          node scripts/test-navigation-asset-versions.mjs
          npx expo export --platform web --output-dir /tmp/trenerki-nav-build
      - name: Test course/menu/profile links on iPhone and desktop
        run: |
          python3 -m http.server 8787 --directory /tmp/trenerki-nav-build >/tmp/trenerki-nav-http.log 2>&1 &
          sleep 2
          node scripts/navigation-browser.mjs http://127.0.0.1:8787
          node scripts/public-release-browser.mjs http://127.0.0.1:8787
      - name: Store snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trenerki-profile-navigation
          path: /tmp/trenerki-nav-*.png
          if-no-files-found: ignore
