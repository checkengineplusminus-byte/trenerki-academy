name: TRENERKI — source-grounded homework in all courses
on:
  push:
    branches: [main]
    paths:
      - 'src/CourseLessonExtras.tsx'
      - 'app/nauka.tsx'
      - 'content/course-extras-first-lesson-20261117.json'
      - 'scripts/test-course-extras-source.mjs'
      - 'scripts/test-course-extras-browser.mjs'
      - '.github/workflows/course-extras-all.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 79 source-backed courses, lessons, tips and homework
        run: node scripts/test-course-extras-source.mjs
  browser_representative:
    needs: content
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install app and real browser engines
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Export working website
        run: npx expo export --platform web --output-dir /tmp/trenerki-course-extras-web
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: Check 10 browser/device profiles and 8 topic-diverse courses
        run: |
          python3 -m http.server 8787 --directory /tmp/trenerki-course-extras-web >/tmp/trenerki-extras-http.log 2>&1 &
          sleep 2
          node scripts/test-course-extras-browser.mjs http://127.0.0.1:8787
  browser_all_79:
    needs: content
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install Expo and Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build real app
        run: npx expo export --platform web --output-dir /tmp/trenerki-course-extras-all
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: Verify every one of 79 course notebooks on desktop and mobile
        run: |
          python3 -m http.server 8787 --directory /tmp/trenerki-course-extras-all >/tmp/trenerki-extras-all-http.log 2>&1 &
          sleep 2
          TRENERKI_COURSE_EXTRAS_MODE=all node scripts/test-course-extras-browser.mjs http://127.0.0.1:8787
