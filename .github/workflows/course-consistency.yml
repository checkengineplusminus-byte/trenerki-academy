name: TRENERKI Academy — spójność kursów
on:
  push:
    branches: [main]
  pull_request:
jobs:
  content_integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check curriculum and test-only sales
        run: node scripts/check-content-consistency.mjs
      - name: Enforce minimum thirty chapters in every course
        run: node scripts/audit-course-standards.mjs --enforce
      - name: Verify Anielka course discovery and consolidated sections
        run: node scripts/test-anielka.mjs
      - name: Verify all 80 specific course illustrations and reduced motion
        run: node scripts/test-course-icons.mjs
  web_bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test six carpentry calculators and real Excel formula engine
        run: node scripts/test-formulas.mjs
      - name: Exclude test and promotional records from sales
        run: node scripts/test-sales-analytics.mjs
      - name: Verify production web bundle
        run: npx expo export --platform web --output-dir /tmp/trenerki-smoke
      - name: Check actual exported Academy assets and all 80 course icons
        run: node scripts/test-exported-academy.mjs /tmp/trenerki-smoke
        env:
          EXPO_NO_TELEMETRY: '1'
