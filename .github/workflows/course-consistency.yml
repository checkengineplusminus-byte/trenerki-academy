name: TRENERKI Academy — spójność kursów
on:
  push:
    branches: [main]
  pull_request:
jobs:
  content_integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check curriculum and test-only sales
        run: node scripts/check-content-consistency.mjs
