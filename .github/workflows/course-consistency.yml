name: TRENERKI Academy — spójność kursów
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  content_integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exam question rotation and scoring
        run: node --experimental-strip-types scripts/test-exam-rotation.mjs
      - name: Verify true single-click selection, Polar F10, OTrack F11 and full status bar
        run: node --experimental-strip-types --test scripts/test-cad-status-and-click.mjs
      - name: Verify AutoCAD MIRROR and ROTATE including group geometry
        run: node --experimental-strip-types --test scripts/test-cad-mirror-rotate.mjs
      - name: Verify AutoCAD multi-selection, OSNAP and complete reference atlas
        run: node --experimental-strip-types --test scripts/test-cad-multiselect.mjs
      - name: Verify AutoCAD full-program exam selection
        run: node --test scripts/test-autocad-exam-bank.mjs
      - name: Verify restored AutoCAD geometry, JOIN and millimetre coordinates
        run: node --experimental-strip-types --test scripts/test-cad-restored.mjs
      - name: Audit the complete 30-lesson AutoCAD handbook and source shortcut coverage
        run: node --experimental-strip-types --test scripts/test-autocad-full-manual-v3.mjs
      - name: Review AutoCAD teaching quality, 30 lessons, and all-course restart
        run: node --test scripts/test-autocad-methodology-review.mjs
      - name: Check curriculum and test-only sales
        run: node scripts/check-content-consistency.mjs
      - name: Enforce minimum thirty chapters in every course
        run: node scripts/audit-course-standards.mjs --enforce
      - name: Test generated affiliate URLs and no hijacked app routes
        run: |
          node scripts/generate-affiliate-short-pages.mjs
          node scripts/test-affiliate-static-pages.mjs
      - name: Check secure affiliate referrals, legal notices and checkout integration
        run: node scripts/test-affiliate-program.mjs
      - name: Verify AI course artwork, Anielka practice and mandatory stage checkpoints
        run: node scripts/test-ai-course-integration.mjs
      - name: Verify Anielka course discovery and consolidated sections
        run: node scripts/test-anielka.mjs
      - name: Verify all 80 specific course illustrations and reduced motion
        run: node scripts/test-course-icons.mjs
  web_bundle:
    needs: content_integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test walidacji ćwiczeń nowego kursu księgowości
        run: node scripts/test-accounting-core-v3.mjs
      - name: Test six carpentry calculators and real Excel formula engine
        run: node scripts/test-formulas.mjs
      - name: Exclude test and promotional records from sales
        run: node scripts/test-sales-analytics.mjs
      - name: Validate professional Stripe PDF and Excel accounting exports
        run: node scripts/test-accounting-exports.mjs
      - name: Validate source-backed Stripe transactions and Saldeo reconciliation
        run: node scripts/test-accounting-ledger-enrichment.mjs
      - name: Generate numeric affiliate pages before web export
        run: node scripts/generate-affiliate-short-pages.mjs
      - name: Verify production web bundle
        run: npx expo export --platform web --output-dir /tmp/trenerki-smoke
      - name: Check actual exported Academy assets and all 80 course icons
        run: node scripts/test-exported-academy.mjs /tmp/trenerki-smoke
        env:
          EXPO_NO_TELEMETRY: '1'

  eas_parity_checks:
    needs: content_integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies for Expo parity tests
        run: npm install --no-audit --no-fund
      - name: Verify complete catalogue progress beyond API pagination
        run: node --experimental-default-type=module --test scripts/test-course-progress.mjs
      - name: Verify exam never accepts obsolete lesson completions
        run: node --test scripts/test-exam-readiness.mjs
      - name: Audit complete AutoCAD manual, 30 simulator exercises and source commands
        run: node --experimental-strip-types --test scripts/test-autocad-full-manual-v3.mjs
      - name: Verify non-repeating AutoCAD teaching and universal restart
        run: node --test scripts/test-autocad-methodology-review.mjs
      - name: Verify restored interactive CAD commands and coordinate geometry
        run: node --experimental-strip-types --test scripts/test-cad-restored.mjs
      - name: Verify group MOVE/COPY/SCALE, snap modes and reference Atlas
        run: node --experimental-strip-types --test scripts/test-cad-multiselect.mjs
      - name: Verify AutoCAD grouped MIRROR/ROTATE and faithful ribbon
        run: node --experimental-strip-types --test scripts/test-cad-mirror-rotate.mjs
      - name: Verify AutoCAD status bar controls and single click selection
        run: node --experimental-strip-types --test scripts/test-cad-status-and-click.mjs
      - name: Verify AutoCAD exam covers all 30 chapters
        run: node --test scripts/test-autocad-exam-bank.mjs
      - name: Verify real AutoCAD DXF starter drawings
        run: node --test scripts/test-autocad-dxf.mjs
      - name: Protect minimum thirty chapters per course
        run: node scripts/audit-course-standards.mjs --enforce
      - name: Verify content, exercises and protected course access
        run: node scripts/check-content-consistency.mjs
      - name: Verify Excel currency calculations and spreadsheet navigation
        run: node scripts/test-excel-currency.mjs
      - name: Verify Excel first-day formulas on numerical and symbolic answers
        run: node scripts/test-excel-firstday-formulas.mjs
      - name: Verify 30 Excel missions, twelve bonus tasks and input formats
        run: node --test scripts/test-excel-all-missions.mjs
      - name: Verify 30 real Excel homework assignments and independent answer checks
        run: node --test scripts/test-excel-real-homework.mjs
      - name: Verify Excel shortcuts and real tables/chart calculations
        run: node --test scripts/test-excel-shortcuts-and-charts.mjs
      - name: Verify Excel function atlas and detailed PDF guide
        run: node --test scripts/test-excel-master-guide.mjs
      - name: Verify AI course artwork, Anielka practice and mandatory stage checkpoints
        run: node scripts/test-ai-course-integration.mjs
      - name: Verify course finding with Anielka
        run: node scripts/test-anielka.mjs
      - name: Verify meaning and uniqueness of all 80 icons
        run: node scripts/test-course-icons.mjs
      - name: Sprawdz obliczenia i import pracowni ksiegowej
        run: node --experimental-default-type=module --test scripts/test-accounting-lab.mjs
      - name: Sprawdz odpowiedzi i szkice czytnika ksiegowosci
        run: node --experimental-default-type=module --test scripts/test-accounting-reader.mjs
      - name: Sprawdz dane stron i historie identyfikatorow
        run: node --experimental-default-type=module --test scripts/test-accounting-identities.mjs
      - name: Sprawdz wejscie i postep encyklopedii
        run: node --experimental-default-type=module --test scripts/test-accounting-entry.mjs
      - name: Sprawdz 100 arkuszy domowych dla Excel bez odpowiedzi i danych prywatnych
        run: node --experimental-default-type=module --test scripts/test-accounting-homework-worksheet.mjs
      - name: Sprawdz kierowanie 100 tematow do wlasciwego modulu pracowni
        run: node --experimental-default-type=module --test scripts/test-accounting-lab-navigation.mjs
      - name: Sprawdz kolejnosc nauki i zachowanie postepow
        run: node --experimental-default-type=module --test scripts/test-accounting-study-path.mjs
