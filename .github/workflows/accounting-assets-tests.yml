name: Majatek — regresja pracowni
on:
  push:
    paths:
      - 'app/majatek-ksiegowy*'
      - 'src/accounting/**'
      - 'scripts/test-accounting-*.mjs'
      - '.github/workflows/accounting-assets-tests.yml'
  pull_request:
    paths:
      - 'app/majatek-ksiegowy*'
      - 'src/accounting/**'
      - 'scripts/test-accounting-*.mjs'
permissions:
  contents: read
jobs:
  assets_and_regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test scripts/test-accounting-*.mjs
