name: TRENERKI — live navigation and profile rollout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navigation-live-check.yml'
      - 'public/academy/course-share.js'
      - 'public/academy/course-share.css'
      - 'public/academy/index.html'
      - 'public/academy/kursy/**'
      - 'public/academy/kategorie/**'
      - 'app/konto.tsx'
      - 'app/moje-kursy.tsx'
      - 'app/ustawienia.tsx'
      - 'public/academy/regulamin.html'
      - 'public/academy/program-afiliacyjny.html'
      - 'public/academy/zrodla-zdjec.html'
      - 'src/support/links.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live_nav:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check actual production mobile menu and content-hashed navigation assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://trenerki.com"
          for attempt in $(seq 1 20); do
            tmp=$(mktemp -d)
            get() { curl -fLsS --connect-timeout 6 --max-time 15 -H 'Cache-Control: no-cache' "$base$1" > "$tmp/$2"; }
            good=1
            get '/academy/index.html' homepage || good=0
            get '/academy/course-share.js' navjs || good=0
            get '/academy/course-share.css' navcss || good=0
            get '/academy/kursy/autocad-skroty.html' autocad || good=0
            get '/academy/kursy/ai-bez-tajemnic.html' ai || good=0
            get '/academy/kategorie/biznes-i-praca.html' category || good=0
            get '/academy/regulamin.html' legal || good=0
            get '/academy/program-afiliacyjny.html' affiliate || good=0
            get '/academy/zrodla-zdjec.html' credits || good=0
            get '/konto' profile || good=0
            get '/moje-kursy' library || good=0
            if [ "$good" = 1 ]; then
              navhash="$(sha256sum "$tmp/navjs" | cut -c1-12)"
              csshash="$(sha256sum "$tmp/navcss" | cut -c1-12)"
              grep -Fq '<details class="mobile-nav"><summary>' "$tmp/homepage" || good=0
              grep -Fq 'href="/firma">Dla firm</a>' "$tmp/homepage" || good=0
              grep -Fq 'initializeAcademyMobileMenu' "$tmp/navjs" || good=0
              grep -Fq 'ta-unified-header' "$tmp/navjs" || good=0
              grep -Fq 'ta-unified-menu' "$tmp/navjs" || good=0
              grep -Fq 'ta-unified-header' "$tmp/navcss" || good=0
              grep -Fq '@media(max-width:420px)' "$tmp/navcss" || good=0
              grep -Fq "/academy/course-share.js?v=${navhash}" "$tmp/homepage" || good=0
              grep -Fq "/academy/course-share.css?v=${csshash}" "$tmp/homepage" || good=0
              for page in autocad ai category legal affiliate credits; do
                grep -Fq "/academy/course-share.js?v=${navhash}" "$tmp/$page" || good=0
                grep -Fq "/academy/course-share.css?v=${csshash}" "$tmp/$page" || good=0
              done
            fi
            if [ "$good" = 1 ]; then
              echo "LIVE NAV VERIFIED: all standalone course, legal, affiliate and contact-style pages; Dla firm, mobile menu, hashed assets, profile and library (attempt $attempt)"
              rm -rf "$tmp"
              exit 0
            fi
            echo "Attempt $attempt: latest navigation assets not fully deployed yet"
            rm -rf "$tmp"
            sleep 12
          done
          echo "::error::New menu and asset fingerprints could not be verified on trenerki.com"
          exit 1
