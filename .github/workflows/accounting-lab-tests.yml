name: Pracownia ksiegowa — testy
on:
  push:
    paths:
      - 'src/accounting/**'
      - 'scripts/test-accounting-lab.mjs'
      - '.github/workflows/accounting-lab-tests.yml'
  pull_request:
    paths:
      - 'src/accounting/**'
      - 'scripts/test-accounting-lab.mjs'
      - '.github/workflows/accounting-lab-tests.yml'
permissions:
  contents: read
jobs:
  obliczenia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test scripts/test-accounting-lab.mjs
