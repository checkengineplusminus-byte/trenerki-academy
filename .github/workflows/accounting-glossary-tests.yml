name: Slownik ksiegowego — testy
on:
  push:
    paths:
      - 'src/accounting/glossary-core.js'
      - 'app/slownik-ksiegowego.tsx'
      - 'scripts/test-accounting-glossary.mjs'
      - '.github/workflows/accounting-glossary-tests.yml'
  pull_request:
    paths:
      - 'src/accounting/glossary-core.js'
      - 'app/slownik-ksiegowego.tsx'
      - 'scripts/test-accounting-glossary.mjs'
permissions:
  contents: read
jobs:
  slownik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test scripts/test-accounting-glossary.mjs
