name: Encyklopedia — wejscie i postep
on:
  push:
    paths:
      - 'app/moje-kursy.tsx'
      - 'app/nauka.tsx'
      - 'legacy/LearningScreen.tsx'
      - 'src/accounting/**'
      - 'scripts/test-accounting-*.mjs'
      - '.github/workflows/accounting-entry-tests.yml'
  pull_request:
    paths:
      - 'app/moje-kursy.tsx'
      - 'app/nauka.tsx'
      - 'legacy/LearningScreen.tsx'
      - 'src/accounting/**'
      - 'scripts/test-accounting-*.mjs'
permissions:
  contents: read
jobs:
  accounting_regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test scripts/test-accounting-*.mjs
