name: TRENERKI — AI course real browser smoke
on:
  push:
    branches: ['main']
  pull_request:
    paths:
      - 'scripts/test-ai-course-browser.mjs'
      - '.github/workflows/ai-course-browser.yml'
      - 'app/nauka.tsx'
      - 'src/GuidedDialogue.tsx'
      - 'src/AdversarialLessonTest.tsx'
      - 'supabase/functions/ta-lesson-guide/index.ts'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  ai_browser_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install app and Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Export web app
        run: npx expo export --platform web --output-dir /tmp/trenerki-ai-browser
      - name: Test ten simulated environments and complete 32-lesson course
        run: |
          python3 -m http.server 8791 --directory /tmp/trenerki-ai-browser >/tmp/ai-course-http.log 2>&1 &
          node scripts/test-ai-course-browser.mjs http://127.0.0.1:8791
          node scripts/test-ai-owned-route-browser.mjs http://127.0.0.1:8791
