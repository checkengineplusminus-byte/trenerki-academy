  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  expert_engine:
    name: Excel 30 rozdziałów — poprawność obliczeń i poziomów
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Instaluj zależności silnika TypeScript przed testem walut
        run: npm install --no-audit --no-fund
      - name: Sprawdź responsywny widok lekcji i boczną nawigację bez omijania blokad
        run: node scripts/test-learning-desktop-layout.mjs
      - name: Sprawdź funkcje ekspertów i kurs od zera
        run: node --experimental-strip-types --test scripts/test-excel-expert.mjs scripts/test-excel-pro-case.mjs scripts/test-excel-knowledge.mjs
      - name: Sprawdź początek Excela — prawidłowe formuły i proste wyjaśnienia
        run: node scripts/test-excel-firstday-formulas.mjs
      - name: Sprawdź wszystkie 30 misji, 30 pytań i 12 dodatków — kwoty, waluty i formuły
        run: node --test scripts/test-excel-all-missions.mjs
      - name: Sprawdź 30 zadań domowych oraz 5 perspektyw eksperckich i 10 ról
        run: node --test scripts/test-excel-real-homework.mjs
      - name: Sprawdź silnik walut i nawigację wirtualnego arkusza
        run: node scripts/test-excel-currency.mjs
      - name: Sprawdź 514 funkcji, 39 rozdziałów i eksport PDF
        run: node --test scripts/test-excel-master-guide.mjs
      - name: Sprawdź 70 skrótów, 66 objaśnionych funkcji i prawdziwe agregacje wykresów
        run: node --test scripts/test-excel-shortcuts-and-charts.mjs
  ten_environments:
    needs: expert_engine
    name: 10 środowisk × 2 cykle → IT → krytyk → sprzedawca
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Instaluj aplikację i Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Eksportuj aplikację
        run: npx expo export --platform web --output-dir /tmp/trenerki-excel-ci
      - name: Dwie rundy środowisk, ocena IT, krytyka i sprzedawcy
        run: |
          python3 -m http.server 8795 --directory /tmp/trenerki-excel-ci >/tmp/trenerki-excel-http.log 2>&1 &
          sleep 2
          node scripts/excel-ten-environments.mjs http://127.0.0.1:8795
          node scripts/excel-all-missions-browser.mjs http://127.0.0.1:8795
      - name: Zapisz raport i zrzuty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-10-srodowisk-2-cykle
          path: |
            /tmp/trenerki-excel-two-cycles.json
            /tmp/trenerki-excel-all-lessons.json
            /tmp/trenerki-excel-qa-*.png
          if-no-files-found: ignore
          retention-days: 14
