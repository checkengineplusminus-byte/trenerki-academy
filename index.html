<script>
(function(){
"use strict";
const C=[null,"#2563eb","#e5a000","#8b5cf6","#0d9488","#e24b4b"];
const T=[null,"Length & Width","Door Height","Balcony Height","Other Measurements","Balcony Photos"];
const SHORT=[null,"Length","Door H","Slab H","Other","Photos"];
const F=[["spiral-stairs","Spiral stairs"],["railings","Internal railings & balustrades"],["balconies","Balconies"],["other","Other"],["not-valid","Not valid"]];
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const stamp=()=>new Date().toISOString();
const D={projects:[],plans:[],marks:[],pics:[],snapshots:[]};
let db,proj=null,plan=null,doc=null,pdfPage=null,curPage=0,mode=1,layers=[false,true,true,true,true,true],layersOpen=false,folder="all",zoom=1,pan={x:0,y:0},fit=1,rendered=null,renderTask=null,renderTimer=null,selected=null,gest=null,touches=new Map(),undo=[],photoFor=null;
const byId=(a,key)=>a.find(x=>x.id===key);
const plans=()=>D.plans.filter(x=>x.projectId===proj.id&&!x.deletedAt);
const marks=()=>D.marks.filter(x=>plan&&x.planId===plan.id&&!x.deletedAt&&x.page===curPage);
const pics=m=>D.pics.filter(x=>x.markerId===m.id&&!x.deletedAt);
const now=()=>new Date().toLocaleString("en-GB");
function msg(s){const e=$("#toast");e.textContent=s;e.style.display="block";clearTimeout(msg.timer);msg.timer=setTimeout(()=>e.style.display="none",3400);}
function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
async function init(){db=await new Promise((ok,no)=>{const r=indexedDB.open("innore-measurement-preview-2026",1);r.onupgradeneeded=()=>{for(const name of Object.keys(D))r.result.createObjectStore(name,{keyPath:"id"});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});await reload();showProjects();}
async function reload(){for(const name of Object.keys(D))D[name]=await req(db.transaction(name).objectStore(name).getAll());}
function put(name,x){return req(db.transaction(name,"readwrite").objectStore(name).put(x));}
function del(name,x){return req(db.transaction(name,"readwrite").objectStore(name).delete(x));}
async function changed(name,record,previous){undo.push({name,id:record.id,previous:previous?structuredClone(previous):null});if(undo.length>75)undo.shift();record.updatedAt=stamp();await put(name,record);const a=D[name],n=a.findIndex(x=>x.id===record.id);if(n<0)a.push(record);else a[n]=record;if(proj){proj.updatedAt=stamp();await put("projects",proj);}if(name!=="snapshots"&&undo.length%8===0)await snapshot("Automatic restore point");}
async function snapshot(label){if(!proj)return;const entry={id:id(),projectId:proj.id,at:stamp(),label,marks:D.marks.filter(m=>m.projectId===proj.id).map(m=>structuredClone(m)),pics:D.pics.filter(m=>m.projectId===proj.id).map(m=>({id:m.id,deletedAt:m.deletedAt||null})),plans:D.plans.filter(m=>m.projectId===proj.id).map(m=>({id:m.id,deletedAt:m.deletedAt||null}))};await put("snapshots",entry);D.snapshots.push(entry);}
function brand(){return '<span class="logo">INNORE<small>MEASUREMENT</small></span>';}
function modal(title,html){$("#modalRoot").innerHTML='<div class="sheet"><div class="between"><h2>'+esc(title)+'</h2><button class="btn sm" data-act="close">× Close</button></div>'+html+'</div>';$("#modalRoot").classList.remove("hidden");}
function close(){const x=$("#modalRoot");x.classList.add("hidden");x.innerHTML="";}
function download(blob,name){const a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
function fname(s){return String(s).replace(/[^A-Za-z0-9 _-]/g,"_").slice(0,70)||"plan";}
function showProjects(){proj=null;plan=null;$("#app").innerHTML='<header>'+brand()+'<div class="spacer"></div><span class="sub">FIELD PREVIEW · LOCAL</span></header><main><div class="hero"><span>FIELD MEASUREMENT WORKSPACE</span><h1>Measure on site.<br>Stay in control.</h1><p>Fast PDF measurement pins, high zoom, balcony photos and one complete project ZIP.</p><button class="btn primary" data-act="new">＋ New project</button> <button class="btn" data-act="demo">Try demo</button></div><div class="notice">TEST VERSION: Plans and photos stay on this device (IndexedDB). This is not a cloud backup or a shared team account. Export a project ZIP regularly.</div><div class="between"><h2>Your projects</h2><button class="btn primary sm" data-act="new">＋ Create</button></div><div class="grid">'+(D.projects.length?D.projects.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(p=>'<button class="card" data-act="project" data-id="'+p.id+'"><div class="eyebrow">PROJECT '+esc(p.number)+'</div><strong>'+esc(p.name)+'</strong><div class="small muted" style="margin-top:9px">Updated '+esc(new Date(p.updatedAt).toLocaleDateString("en-GB"))+'</div></button>').join(""):'<div class="card muted">No projects yet. Create one or open the demo.</div>')+'</div></main>';}
function showProject(){plan=null;const pp=plans(),arr=pp.filter(x=>folder==="all"||x.folder===folder);let floors=Array.from(new Set(arr.map(x=>x.floor))).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));$("#app").innerHTML='<header><button class="btn sm" data-act="home">← Projects</button>'+brand()+'<div class="spacer"></div></header><main><div class="between"><div><div class="muted small">PROJECT '+esc(proj.number)+'</div><h1>'+esc(proj.name)+'</h1></div><div class="flex"><button class="btn sm" data-act="history">↶ History</button><button class="btn sm" data-act="pdf">▧ Generate PDF</button><button class="btn dark sm" data-act="zip">↓ Project ZIP</button></div></div><div class="notice">Files auto-save to this browser. One ZIP contains every floor, annotated PDF and balcony photo folder. Not synced with other phones.</div><div class="between"><h2>Project folders</h2><button class="btn primary sm" data-act="upload">＋ Upload PDFs</button></div><div class="flex" style="margin-top:12px"><button data-act="filter" data-f="all" class="pill '+(folder==="all"?"active":"")+'">All ('+pp.length+')</button>'+F.map(f=>'<button data-act="filter" data-f="'+f[0]+'" class="pill '+(folder===f[0]?"active":"")+'">'+esc(f[1])+'</button>').join("")+'</div>'+(arr.length?floors.map(fl=>'<div class="floor">'+esc(fl)+'</div><div class="grid">'+arr.filter(p=>p.floor===fl).map(p=>'<div class="card between"><div><strong>'+esc(p.name)+'</strong><div class="small muted">'+esc(F.find(f=>f[0]===p.folder)?.[1]||"Other")+(p.sourceId?" · Duplicate":"")+'</div></div><button class="btn primary sm" data-act="edit" data-id="'+p.id+'">Open →</button></div>').join("")+'</div>').join(""):'<div class="card muted" style="margin-top:24px">No PDFs in this folder yet. Upload a plan to begin.</div>')+'</main>';}
async function newProject(number,name){if(!number.trim())throw Error("Project number required");const p={id:id(),number:number.trim(),name:name.trim()||"Project "+number,updatedAt:stamp()};await changed("projects",p);proj=p;folder="all";close();showProject();}
async function demo(){let p=D.projects.find(x=>x.number==="DEMO-001");if(!p){if(!window.PDFLib)throw Error("PDF library is still loading");const d=await PDFLib.PDFDocument.create(),page=d.addPage([850,595]);page.drawText("DEMO FLOOR 4 - BALCONIES",{x:40,y:545,size:21});page.drawRectangle({x:95,y:100,width:590,height:360,borderWidth:3,borderColor:PDFLib.rgb(.1,.23,.34)});for(let i=0;i<4;i++){page.drawRectangle({x:114+i*145,y:463,width:105,height:58,borderWidth:2,borderColor:PDFLib.rgb(.1,.33,.4)});page.drawText("BALCONY "+(i+1),{x:126+i*145,y:495,size:11});}page.drawRectangle({x:285,y:190,width:190,height:120,borderWidth:2,borderColor:PDFLib.rgb(.2,.4,.47)});const b=new Blob([await d.save()],{type:"application/pdf"});p={id:id(),number:"DEMO-001",name:"Sample building - test tools",updatedAt:stamp()};await put("projects",p);D.projects.push(p);const x={id:id(),projectId:p.id,name:"Floor 4 - balcony railings",floor:"Floor 4",folder:"balconies",pdf:b,sourceId:null,updatedAt:stamp()};await put("plans",x);D.plans.push(x);}proj=p;folder="all";showProject();const x=plans()[0];if(x)await openPlan(x.id);}
function uploadDialog(){modal("Upload floor PDFs",'<label>Floor name</label><input id="uploadFloor" value="Floor 1" placeholder="Floor 4"><label>Project folder</label><select id="uploadFolder">'+F.map(f=>'<option value="'+f[0]+'"'+(f[0]===(folder==="all"?"balconies":folder)?" selected":"")+'>'+esc(f[1])+'</option>').join("")+'</select><button class="btn primary" style="width:100%;margin-top:19px" data-act="chooseFiles">Choose PDF plans</button><p class="muted small">You can add several PDFs to the same floor, or duplicate an existing one.</p>');}
function editShell(){const siblings=plans().sort((a,b)=>a.floor.localeCompare(b.floor,undefined,{numeric:true}));$("#app").innerHTML='<div class="editor"><div class="editorbar"><button class="btn sm" data-act="back">←</button><div class="details"><strong>'+esc(plan.name)+'</strong><span>'+esc(proj.number)+' · '+esc(plan.floor)+'</span></div><select id="switchPlan" class="btn sm hide-small">'+siblings.map(x=>'<option value="'+x.id+'"'+(x.id===plan.id?" selected":"")+'>'+esc(x.floor)+' · '+esc(x.name)+'</option>').join("")+'</select><button class="btn sm" data-act="duplicate">▣ <span class="hide-small">Duplicate</span></button><button class="btn sm" data-act="undo">↶</button><button class="btn sm" data-act="layers">☷ Layers</button><button class="btn primary sm" data-act="pdf">PDF</button></div><div class="workspace"><div id="viewer"><canvas id="pdfCanvas"></canvas><div id="pinLayer"></div><div id="loading" class="notice" style="position:absolute;left:10px;top:10px;z-index:3;max-width:280px">Loading vector PDF…</div><div class="zoomctrl"><button class="btn" data-act="zin">＋</button><div class="zoomlabel" id="zoomLabel">100%</div><button class="btn" data-act="zout">−</button><button class="btn sm" data-act="zfit">⤢</button></div><div class="tools">'+[0,1,2,3,4,5].map(n=>'<button data-act="tool" data-n="'+n+'" class="tool '+(mode===n?"active":"")+'" style="--c:'+(C[n]||"#8799a5")+'"><span class="bubble">'+(n||"✥")+'</span><span>'+(n?SHORT[n]:"Move")+'</span></button>').join("")+'</div></div><aside id="layerPanel" class="layerpanel '+(layersOpen?"":"hidden")+'"><div class="between"><strong>VISIBLE LAYERS</strong><button class="btn sm" data-act="layers">×</button></div><p class="small muted">Hide any type without deleting measurements.</p><div class="flex"><button class="btn sm" data-act="allLayers">Show all</button><button class="btn sm" data-act="noLayers">Hide all</button></div>'+[1,2,3,4,5].map(n=>'<label><input type="checkbox" data-layer="'+n+'" '+(layers[n]?"checked":"")+'><span class="color" style="background:'+C[n]+'"></span>'+T[n]+'</label>').join("")+'</aside></div></div>';}
async function openPlan(pid){plan=byId(plans(),pid);if(!plan)return;curPage=0;zoom=1;pan={x:0,y:0};layersOpen=false;selected=null;undo=[];editShell();const v=$("#viewer");v.addEventListener("pointerdown",onDown);v.addEventListener("pointermove",onMove);v.addEventListener("pointerup",onUp);v.addEventListener("pointercancel",onUp);v.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.3:1/1.3,e.clientX-v.getBoundingClientRect().left,e.clientY-v.getBoundingClientRect().top);},{passive:false});try{if(!window.pdfjsLib)throw Error("PDF viewer needs network on first load");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";doc=await pdfjsLib.getDocument({data:new Uint8Array(await plan.pdf.arrayBuffer())}).promise;pdfPage=await doc.getPage(1);const r=v.getBoundingClientRect();fit=Math.min((r.width-30)/pdfPage.view[2],(r.height-30)/pdfPage.view[3]);$("#loading").classList.add("hidden");renderPins();renderPdf();}catch(e){$("#loading").textContent="Could not open PDF: "+e.message;}window.onresize=()=>{if(!pdfPage||!$("#viewer"))return;const r=$("#viewer").getBoundingClientRect();fit=Math.min((r.width-30)/pdfPage.view[2],(r.height-30)/pdfPage.view[3]);renderPins();renderPdf();};}
function geom(){const v=$("#viewer"),w=v.clientWidth,h=v.clientHeight,pw=pdfPage.view[2]*fit*zoom,ph=pdfPage.view[3]*fit*zoom;return {w,h,scale:fit*zoom,left:(w-pw)/2+pan.x,top:(h-ph)/2+pan.y,pw,ph};}
function atPage(cx,cy){const g=geom();return {x:(cx-g.left)/g.pw,y:(cy-g.top)/g.ph};}
function atScreen(x,y){const g=geom();return {x:g.left+x*g.pw,y:g.top+y*g.ph};}
function previewTransform(){if(!rendered)return;const g=geom(),k=g.scale/rendered.scale,tx=g.left-k*rendered.left,ty=g.top-k*rendered.top;$("#pdfCanvas").style.transform="matrix("+k+",0,0,"+k+","+tx+","+ty+")";}
function renderPdf(){clearTimeout(renderTimer);previewTransform();renderTimer=setTimeout(async()=>{if(!$("#pdfCanvas")||!pdfPage)return;try{if(renderTask)renderTask.cancel();const v=$("#viewer"),g=geom(),c=$("#pdfCanvas"),dpr=Math.min(devicePixelRatio||1,1.75);c.width=Math.round(g.w*dpr);c.height=Math.round(g.h*dpr);c.style.width=g.w+"px";c.style.height=g.h+"px";c.style.transform="none";const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);const vp=pdfPage.getViewport({scale:g.scale});renderTask=pdfPage.render({canvasContext:ctx,viewport:vp,transform:[dpr,0,0,dpr,g.left*dpr,g.top*dpr]});await renderTask.promise;rendered=g;previewTransform();}catch(e){if(e.name!=="RenderingCancelledException")console.error(e);}},140);}
function renderPins(){const box=$("#pinLayer");if(!box||!pdfPage)return;const shown=marks().filter(x=>layers[x.type]);box.innerHTML=shown.map(m=>{const p=atScreen(m.x,m.y),value=m.type===5?"Balcony "+String(m.balconyNo).padStart(3,"0")+" · "+pics(m).length+" photos":m.value||"Enter measurement";return '<div class="pin '+(m.type===5?"photo ":"")+(selected&&selected.id===m.id?"sel":"")+'" data-pin="'+m.id+'" style="--c:'+C[m.type]+';left:'+p.x+'px;top:'+p.y+'px"><span class="dot">'+(m.type===5?String(m.balconyNo).padStart(2,"0"):m.type)+'</span><span class="arrow" style="transform:rotate('+Number(m.angle||0)+'deg)"></span><span class="txt">'+esc(value)+'</span></div>';}).join("");$("#zoomLabel").textContent=Math.round(zoom*100)+"%";}
function zoomAt(f,cx,cy){if(!pdfPage)return;const g=geom(),px=(cx-g.left)/g.scale,py=(cy-g.top)/g.scale;zoom=Math.max(.4,Math.min(32,zoom*f));const v=$("#viewer"),sx=fit*zoom,baseLeft=(v.clientWidth-pdfPage.view[2]*sx)/2,baseTop=(v.clientHeight-pdfPage.view[3]*sx)/2;pan={x:cx-px*sx-baseLeft,y:cy-py*sx-baseTop};renderPins();renderPdf();}
function onDown(e){if(!pdfPage)return;if(e.button&&e.pointerType==="mouse")return;const v=$("#viewer");v.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=Array.from(touches.values()),dx=a[0].x-a[1].x,dy=a[0].y-a[1].y;gest={pinch:true,dist:Math.hypot(dx,dy),z:zoom,lastDist:Math.hypot(dx,dy)};return;}const pinEl=e.target.closest("[data-pin]"),m=pinEl?byId(D.marks,pinEl.dataset.pin):null;gest={pinch:false,marker:m,markerStart:m?structuredClone(m):null,x:e.clientX,y:e.clientY,pan:{...pan},moved:false};}
function onMove(e){if(!touches.has(e.pointerId)||!pdfPage)return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=Array.from(touches.values()),dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx=(a[0].x+a[1].x)/2-$("#viewer").getBoundingClientRect().left,cy=(a[0].y+a[1].y)/2-$("#viewer").getBoundingClientRect().top;if(!gest||!gest.pinch)gest={pinch:true,lastDist:dist};else if(gest.lastDist>0)zoomAt(dist/gest.lastDist,cx,cy);gest.lastDist=dist;return;}if(!gest||gest.pinch)return;const dx=e.clientX-gest.x,dy=e.clientY-gest.y;if(Math.hypot(dx,dy)>7)gest.moved=true;if(!gest.moved)return;if(gest.marker){const p=atPage(e.clientX-$("#viewer").getBoundingClientRect().left,e.clientY-$("#viewer").getBoundingClientRect().top);gest.marker.x=Math.max(0,Math.min(1,p.x));gest.marker.y=Math.max(0,Math.min(1,p.y));renderPins();}else{pan={x:gest.pan.x+dx,y:gest.pan.y+dy};renderPins();previewTransform();}}
async function onUp(e){if(!touches.has(e.pointerId))return;touches.delete(e.pointerId);if(touches.size){gest={pinch:true};return;}const g=gest;gest=null;if(!g||g.pinch){renderPdf();return;}if(g.marker){if(g.moved){await changed("marks",{...g.marker},g.markerStart);renderPins();msg("Marker position saved");}else openMark(g.marker.id);return;}if(g.moved){renderPdf();return;}if(mode===0)return;const v=$("#viewer"),pos=atPage(e.clientX-v.getBoundingClientRect().left,e.clientY-v.getBoundingClientRect().top);if(pos.x<0||pos.y<0||pos.x>1||pos.y>1)return;const m={id:id(),projectId:proj.id,planId:plan.id,page:curPage,type:mode,x:pos.x,y:pos.y,value:"",note:"",angle:0,balconyNo:null,createdAt:stamp()};if(mode===5){const numbers=D.marks.filter(x=>x.projectId===proj.id&&x.type===5&&!x.deletedAt&&byId(D.plans,x.planId)?.floor===plan.floor).map(x=>x.balconyNo||0);m.balconyNo=Math.max(0,...numbers)+1;}await changed("marks",m);renderPins();openMark(m.id);}
function openMark(mid){const m=byId(D.marks,mid);if(!m)return;selected=m;renderPins();if(m.type===5){modal("Balcony "+String(m.balconyNo).padStart(3,"0"),'<p class="muted">Floor: '+esc(plan.floor)+' · Photos: '+pics(m).length+' / 20</p><div class="flex"><button class="btn primary" data-act="camera">📷 Take photo</button><button class="btn" data-act="gallery">＋ Add pictures</button></div><div id="picList" class="photos"></div><div style="margin-top:16px"><button class="btn sm" data-act="deleteMark">Delete pin (recoverable)</button></div>');photoGrid(m);}else{modal(T[m.type],'<form id="markForm"><label>Measurement / note (mm)</label><input id="val" required inputmode="text" value="'+esc(m.value)+'" placeholder="e.g. 2200 GV"><div class="flex" style="margin:10px 0">'+["GV","FAS","OK","H=","mm"].map(s=>'<button type="button" class="stamp" data-act="stamp" data-s="'+s+'">'+s+'</button>').join("")+'</div><label>Additional note</label><textarea id="note">'+esc(m.note)+'</textarea><label>Arrow rotation: <span id="deg">'+(m.angle||0)+'</span>°</label><input id="angle" type="range" min="-180" max="180" step="5" value="'+(m.angle||0)+'"><button class="btn primary" style="width:100%;margin-top:14px" type="submit">✓ Save measurement</button></form><div style="margin-top:12px"><button class="btn sm" data-act="deleteMark">Move to recovery bin</button></div>');$("#angle").oninput=e=>$("#deg").textContent=e.target.value;$("#markForm").onsubmit=async e=>{e.preventDefault();const old=structuredClone(m);m.value=$("#val").value.trim();m.note=$("#note").value;m.angle=Number($("#angle").value);await changed("marks",{...m},old);close();renderPins();msg("Measurement saved");};}}
function photoGrid(m){const box=$("#picList");if(!box)return;const ps=pics(m);box.innerHTML=ps.map(p=>'<figure><img data-ph="'+p.id+'"><button data-act="deletePic" data-id="'+p.id+'">×</button></figure>').join("");for(const p of ps){const img=box.querySelector('[data-ph="'+p.id+'"]'),u=URL.createObjectURL(p.blob);img.src=u;img.onload=()=>URL.revokeObjectURL(u);}}
async function addPhotos(files){const m=selected;if(!m||m.type!==5)return;if(pics(m).length+files.length>20){msg("Maximum 20 photos per balcony");return;}for(const file of files){if(!file.type.startsWith("image/"))continue;const p={id:id(),markerId:m.id,planId:plan.id,projectId:proj.id,name:file.name||"camera.jpg",blob:file,createdAt:stamp()};await changed("pics",p);}photoGrid(m);renderPins();msg("Balcony photos saved");}
async function removeMark(){if(!selected)return;await snapshot("Before deleting marker");const old=structuredClone(selected);await changed("marks",{...selected,deletedAt:stamp()},old);selected=null;close();renderPins();}
async function undoLast(){const u=undo.pop();if(!u){msg("Nothing to undo");return;}if(u.previous)await put(u.name,u.previous);else await del(u.name,u.id);await reload();renderPins();msg("Undo complete");}
async function restore(sid){const s=byId(D.snapshots,sid);if(!s)return;if(!confirm("Restore measurement state from this date?"))return;for(const m of D.marks.filter(x=>x.projectId===proj.id)){if(!s.marks.some(x=>x.id===m.id))await put("marks",{...m,deletedAt:stamp()});}for(const m of s.marks)await put("marks",m);for(const p of D.pics.filter(x=>x.projectId===proj.id)){const o=s.pics.find(x=>x.id===p.id);await put("pics",{...p,deletedAt:o?o.deletedAt:stamp()});}for(const p of D.plans.filter(x=>x.projectId===proj.id)){const o=s.plans.find(x=>x.id===p.id);await put("plans",{...p,deletedAt:o?o.deletedAt:stamp()});}await reload();close();showProject();msg("Restore point applied");}
function showHistory(){const ss=D.snapshots.filter(x=>x.projectId===proj.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,25);modal("Recovery & history",'<p class="muted">Recovery points are stored on THIS DEVICE only. Export a project ZIP for a separate backup.</p><button class="btn" data-act="saveSnapshot">＋ Create recovery point</button>'+ss.map(s=>'<div class="between card" style="margin-top:7px"><div><b>'+esc(s.label)+'</b><div class="small muted">'+esc(new Date(s.at).toLocaleString("en-GB"))+'</div></div><button class="btn sm" data-act="restore" data-id="'+s.id+'">Restore</button></div>').join(""));}
function poly(){if(!window.PDFLib||!window.JSZip)throw Error("Export libraries are loading. Reload online.");}
async function planPDF(p){poly();const pdf=await PDFLib.PDFDocument.load(await p.pdf.arrayBuffer()),font=await pdf.embedFont(PDFLib.StandardFonts.HelveticaBold);for(let i=0;i<pdf.getPageCount();i++){const pg=pdf.getPage(i),w=pg.getWidth(),h=pg.getHeight();for(const m of D.marks.filter(x=>x.planId===p.id&&x.page===i&&!x.deletedAt)){const c=C[m.type],rgb=PDFLib.rgb(parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255),x=m.x*w,y=(1-m.y)*h,label=(m.type===5?"BALCONY "+m.balconyNo+" ("+pics(m).length+" PHOTOS)":m.value||"Measurement").replace(/[^\x20-\x7E]/g," ").slice(0,55),size=Math.max(8,Math.min(14,w/100));pg.drawCircle({x,y,size:Math.max(5,w/180),color:rgb});const tw=font.widthOfTextAtSize(label,size)+10,tx=Math.max(5,Math.min(w-tw-5,x+16)),ty=Math.max(10,Math.min(h-size-10,y+18));pg.drawLine({start:{x,y},end:{x:tx,y:ty},color:rgb,thickness:2});pg.drawRectangle({x:tx-4,y:ty-3,width:tw,height:size+7,color:rgb});pg.drawText(label,{x:tx,y:ty,size,font,color:PDFLib.rgb(1,1,1)});}}return await pdf.save();}
async function exportPDF(){if(!proj||!plans().length){msg("Upload a PDF first");return;}poly();msg("Generating PDF…");const master=await PDFLib.PDFDocument.create();for(const p of plans()){const part=await PDFLib.PDFDocument.load(await planPDF(p));const pages=await master.copyPages(part,part.getPageIndices());for(const page of pages)master.addPage(page);}download(new Blob([await master.save()],{type:"application/pdf"}),fname(proj.number)+"_annotated_plans.pdf");msg("Project PDF exported");}
async function exportZIP(){if(!proj||!plans().length){msg("Upload a PDF first");return;}poly();await snapshot("Export backup");msg("Building full project ZIP…");const z=new JSZip(),dir=z.folder(fname(proj.number)+"_"+fname(proj.name)),combined=await PDFLib.PDFDocument.create();const recovery={project:proj,plans:plans().map(x=>({id:x.id,floor:x.floor,name:x.name,folder:x.folder,sourceId:x.sourceId})),marks:D.marks.filter(x=>x.projectId===proj.id),photos:D.pics.filter(x=>x.projectId===proj.id).map(x=>({id:x.id,markerId:x.markerId,planId:x.planId,name:x.name,deletedAt:x.deletedAt||null}))};for(const p of plans()){const pageDir=dir.folder(fname(p.floor)),planDir=pageDir.folder("Plans"),photoDir=pageDir.folder("Balconies");const bytes=await planPDF(p);planDir.file(fname(p.name)+"_"+p.id.slice(0,6)+".pdf",bytes);const part=await PDFLib.PDFDocument.load(bytes);for(const pg of await combined.copyPages(part,part.getPageIndices()))combined.addPage(pg);const bs=D.marks.filter(x=>x.planId===p.id&&x.type===5&&!x.deletedAt);for(const m of bs){const b=photoDir.folder("Balcony_"+String(m.balconyNo).padStart(3,"0"));for(const [i,ph] of pics(m).entries()){const ext=ph.blob.type==="image/png"?"png":"jpg";b.file(String(i+1).padStart(2,"0")+"_"+fname(ph.name.replace(/\.[^.]+$/,""))+"."+ext,ph.blob);}if(!pics(m).length)b.file("NO_PHOTOS.txt","No photos recorded");}}dir.file("All_Annotated_Plans.pdf",await combined.save());dir.file("Project_Metadata_Recovery.json",JSON.stringify(recovery,null,2));dir.file("README.txt","Innore Measurement test export. One ZIP per project. Plans and photos grouped by floor. Local browser data is not cloud-backed.");download(await z.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:4}}),fname(proj.number)+"_Innore_Measurement.zip");msg("Complete project ZIP exported");}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const action=b.dataset.act;try{if(action==="new"){modal("Create project",'<form id="projectForm"><label>Project number</label><input id="projectNumber" required placeholder="e.g. 262"><label>Project name</label><input id="projectName" required placeholder="Lysverket Moss"><button class="btn primary" style="width:100%;margin-top:17px">Create</button></form>');$("#projectForm").onsubmit=async ev=>{ev.preventDefault();await newProject($("#projectNumber").value,$("#projectName").value);};}
else if(action==="close")close();else if(action==="demo")await demo();else if(action==="project"){proj=byId(D.projects,b.dataset.id);folder="all";showProject();}
else if(action==="home")showProjects();else if(action==="back"){showProject();}else if(action==="filter"){folder=b.dataset.f;showProject();}
else if(action==="upload")uploadDialog();else if(action==="chooseFiles")$("#planFile").click();else if(action==="edit")await openPlan(b.dataset.id);
else if(action==="duplicate"){modal("Duplicate plan",'<p class="muted">Same PDF, completely separate measurements.</p><label>New plan name</label><input id="dupName" value="'+esc(plan.name+" - More measurements")+'"><label>Floor</label><input id="dupFloor" value="'+esc(plan.floor)+'"><label>Folder</label><select id="dupFolder">'+F.map(f=>'<option value="'+f[0]+'"'+(f[0]===plan.folder?" selected":"")+'>'+esc(f[1])+'</option>').join("")+'</select><button data-act="dupConfirm" class="btn primary" style="width:100%;margin-top:17px">Create duplicate</button>');}
else if(action==="dupConfirm"){const x={...plan,id:id(),name:$("#dupName").value.trim()||plan.name+" - Copy",floor:$("#dupFloor").value.trim()||plan.floor,folder:$("#dupFolder").value,sourceId:plan.sourceId||plan.id,updatedAt:stamp()};await put("plans",x);D.plans.push(x);close();await openPlan(x.id);msg("Independent plan copy saved");}
else if(action==="tool"){mode=Number(b.dataset.n);$$(".tool").forEach(x=>x.classList.toggle("active",Number(x.dataset.n)===mode));}
else if(action==="zin")zoomAt(1.7,$("#viewer").clientWidth/2,$("#viewer").clientHeight/2);
else if(action==="zout")zoomAt(1/1.7,$("#viewer").clientWidth/2,$("#viewer").clientHeight/2);
else if(action==="zfit"){zoom=1;pan={x:0,y:0};renderPins();renderPdf();}
else if(action==="layers"){$("#layerPanel").classList.toggle("hidden");layersOpen=!$("#layerPanel").classList.contains("hidden");}
else if(action==="allLayers"||action==="noLayers"){for(let n=1;n<=5;n++)layers[n]=action==="allLayers";$$("[data-layer]").forEach(x=>x.checked=layers[Number(x.dataset.layer)]);renderPins();}
else if(action==="undo")await undoLast();else if(action==="stamp"){const v=$("#val");if(v){v.value=b.dataset.s==="H="?("H="+v.value):(v.value+" "+b.dataset.s).trim();v.focus();}}
else if(action==="camera"){photoFor=selected?.id;$("#photoCamera").click();}else if(action==="gallery"){photoFor=selected?.id;$("#photoFiles").click();}
else if(action==="deleteMark")await removeMark();else if(action==="deletePic"){const p=byId(D.pics,b.dataset.id);if(p){await snapshot("Before deleting photo");await changed("pics",{...p,deletedAt:stamp()},p);photoGrid(selected);renderPins();}}
else if(action==="history")showHistory();else if(action==="saveSnapshot"){await snapshot("Manual restore point");showHistory();msg("Restore point saved");}
else if(action==="restore")await restore(b.dataset.id);else if(action==="pdf")await exportPDF();else if(action==="zip")await exportZIP();
}catch(err){console.error(err);msg("Error: "+err.message);}});
document.addEventListener("change",async e=>{if(e.target.dataset.layer){layers[Number(e.target.dataset.layer)]=e.target.checked;renderPins();}if(e.target.id==="switchPlan")await openPlan(e.target.value);});
$("#planFile").addEventListener("change",async e=>{const floor=$("#uploadFloor")?.value.trim()||"Floor 1",cat=$("#uploadFolder")?.value||"balconies",ff=Array.from(e.target.files);e.target.value="";close();for(const f of ff){if(!/\.pdf$/i.test(f.name)&&f.type!=="application/pdf"){msg("Only PDF files accepted");continue;}if(f.size>110*1024*1024){msg("File is too large for the mobile preview (110 MB)");continue;}const p={id:id(),projectId:proj.id,name:f.name.replace(/\.pdf$/i,""),floor,folder:cat,pdf:f,sourceId:null,updatedAt:stamp()};await put("plans",p);D.plans.push(p);}await snapshot("Floor PDFs uploaded");showProject();msg("Floor PDFs saved locally");});
for(const which of ["photoCamera","photoFiles"])$("#"+which).addEventListener("change",async e=>{const ff=Array.from(e.target.files);e.target.value="";if(selected?.id!==photoFor){msg("Photo destination changed");return;}await addPhotos(ff);});
init().catch(e=>{$("#app").innerHTML='<main><div class="notice">Cannot start local storage: '+esc(e.message)+'</div></main>';});
})();
</script></body></html>
