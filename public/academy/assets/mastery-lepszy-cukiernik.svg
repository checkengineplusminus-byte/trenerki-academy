<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Mąka, tłuszcz, cukier i temperatura: właściwości receptury"><rect width="960" height="540" rx="26" fill="#f4f8f2"/><rect x="22" y="22" width="916" height="496" rx="24" fill="#ffffff" stroke="#d6e5d5" stroke-width="3"/><text x="55" y="70" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#214c35">Mąka, tłuszcz, cukier i temperatura: właściwości</text><text x="55" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#214c35">receptury</text><rect x="52" y="145" width="305" height="302" rx="28" fill="#eaf3e7" stroke="#d4e5d0" stroke-width="3"/><g transform="translate(79 176) scale(1.0)"><circle cx="127" cy="126" r="98" fill="#e6f1e4" stroke="#7f9e84" stroke-width="9"/><circle cx="127" cy="126" r="64" fill="#fff" stroke="#b9d4b8" stroke-width="6"/><path d="M75 127q51-60 105 0q-46 65-105 0" fill="#dbaf75"/><circle cx="112" cy="121" r="11" fill="#6e9768"/></g><rect x="385" y="145" width="514" height="92" rx="17" fill="#eaf1e8" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="176" r="15" fill="#78a585"/><text x="410" y="182" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">1</text><text x="444" y="176" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">POZNAJ</text><text x="412" y="201" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Gluten wpływa na strukturę ciasta, tłuszcz na kruchość i</text><text x="412" y="220" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">napowietrzenie, a cukier na…</text></rect><rect x="385" y="250" width="514" height="92" rx="17" fill="#f3f6ef" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="281" r="15" fill="#78a585"/><text x="410" y="287" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">2</text><text x="444" y="281" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">ZASTOSUJ</text><text x="412" y="306" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Dokładnie waż składniki, zapisuj gramaturę, temperaturę oraz wynik po</text><text x="412" y="325" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">pieczeniu.</text></rect><rect x="385" y="355" width="514" height="92" rx="17" fill="#eaf1e8" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="386" r="15" fill="#78a585"/><text x="410" y="392" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">3</text><text x="444" y="386" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">SPRAWDŹ</text><text x="412" y="411" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Biszkopt opada.</text></rect><path d="M153 466h656" stroke="#c0d5be" stroke-width="4"/><text x="53" y="494" font-family="Arial,sans-serif" font-size="15" fill="#597361">Materiał → proces → kontrola wyniku</text></svg>