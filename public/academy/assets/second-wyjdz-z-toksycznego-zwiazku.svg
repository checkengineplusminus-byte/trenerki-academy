<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Manipulacja, izolacja i kontrola — konkretne sygnały"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Manipulacja, izolacja i kontrola — konkretne sygnały</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><circle cx="73" cy="70" r="29" fill="#9dbfa8"/><circle cx="181" cy="74" r="32" fill="#c5ae91"/><path d="M26 221q-4-105 48-105q52 0 50 105M137 221q-8-105 44-105q52 0 49 105" fill="#e6eee0" stroke="#799c84" stroke-width="9"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Nie każda trudna rozmowa oznacza przemoc, ale powtarzający się wzorzec</text><text x="433" y="198" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">kontroli i zastraszania jest sygnałem alarmowym</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Osoba wymaga codziennych zdjęć potwierdzających miejsce pobytu i</text><text x="433" y="335" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">grozi, że zabierze pieniądze w razie odmowy</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Wypisz pięć sygnałów kontroli i bezpieczne osoby lub instytucje, z</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">którymi można omówić sytuację.</text></svg>