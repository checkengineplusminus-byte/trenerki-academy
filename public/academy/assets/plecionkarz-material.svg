<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Pręt wikliny — grubszy i cieńszy koniec"><rect width="960" height="540" fill="#f4f7f1"/><rect x="25" y="25" width="910" height="490" rx="17" fill="#fff" stroke="#d1dfd2" stroke-width="2"/><text x="58" y="78" font-family="Arial" font-size="30" font-weight="bold" fill="#275239">Pręt wikliny — grubszy i cieńszy koniec</text><text x="58" y="112" font-family="Arial" font-size="17" fill="#66816c">Jakość włókien, średnica i pęknięcia wpływają na splot</text><path d="M126 352Q390 314 790 186" stroke="#a47848" stroke-width="21" fill="none" stroke-linecap="round"/><path d="M126 352Q390 314 790 186" stroke="#d5b17e" stroke-width="9" fill="none" stroke-linecap="round"/><g stroke="#537c5d" stroke-width="4"><path d="M170 356v79M790 186v85M475 282v106"/></g><g font-family="Arial" font-size="21" fill="#2b6044"><text x="74" y="458">Gruby butt</text><text x="699" y="296">Cienki tip</text><text x="346" y="411">kontroluj przebieg włókien</text></g><rect x="75" y="155" width="300" height="70" rx="10" fill="#f0eadd"/><text x="95" y="186" font-family="Arial" font-size="18" fill="#6f633e">Równa długość ≠ równa giętkość</text><text x="95" y="210" font-family="Arial" font-size="15" fill="#6f633e">Dobierz stan i średnicę pręta</text></svg>