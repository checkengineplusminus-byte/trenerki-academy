<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">Odpady w warsztacie ciesielskim · rozpoznanie i przekazanie</title>
  <rect width="960" height="540" rx="18" fill="#f4f8ef"/>
  <g font-family="system-ui,sans-serif" fill="#173b2b">
    <text x="48" y="65" font-size="32" font-weight="700">Co zostało po pracy?</text>
    <text x="48" y="101" font-size="17">Najpierw rozpoznaj materiał i sposób użytkowania. Następnie zaplanuj segregację.</text>
    <rect x="48" y="150" width="266" height="286" rx="14" fill="#fff" stroke="#cddcc9"/>
    <rect x="347" y="150" width="266" height="286" rx="14" fill="#fff" stroke="#cddcc9"/>
    <rect x="646" y="150" width="266" height="286" rx="14" fill="#fff" stroke="#cddcc9"/>
    <path d="M105 226h151v45H105zM117 286h126v28H117z" fill="#d9b285" stroke="#9b6e47" stroke-width="2"/>
    <path d="M410 223l140 30v46l-140-30z" fill="#be9d7c" stroke="#795644" stroke-width="2"/>
    <path d="M711 231h135l-16 82H727zM706 231h145m-103-22h56" fill="#e7ede5" stroke="#55806b" stroke-width="4"/>
    <text x="181" y="354" font-size="19" font-weight="700" text-anchor="middle">Czyste ścinki</text>
    <text x="480" y="354" font-size="19" font-weight="700" text-anchor="middle">Drewno po obróbce</text>
    <text x="779" y="354" font-size="19" font-weight="700" text-anchor="middle">Opakowania i resztki</text>
    <text x="181" y="384" font-size="16" text-anchor="middle">Sprawdź możliwość użycia.</text>
    <text x="480" y="384" font-size="16" text-anchor="middle">Sprawdź impregnację i powłoki.</text>
    <text x="779" y="384" font-size="16" text-anchor="middle">Sprawdź, co zawierały.</text>
    <text x="48" y="486" font-size="17">Nieznanego odpadu nie mieszaj z innymi. Ustal zasady przekazania dla danego materiału.</text>
  </g>
</svg>
