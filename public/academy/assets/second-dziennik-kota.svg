<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Wywiad i warunki przyjęcia"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Wywiad i warunki przyjęcia</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><path d="M48 111l14-80 52 42q17-8 29 0l48-42 13 80q14 51-28 83q-42 30-86 0q-47-31-42-83Z" fill="#d9b99b" stroke="#8a7058" stroke-width="8"/><circle cx="96" cy="126" r="10" fill="#547567"/><circle cx="161" cy="126" r="10" fill="#547567"/><path d="M115 152l12 12 13-12" fill="#9d796b"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Wywiad powinien obejmować dietę, zachowanie, historię chorób, leki,</text><text x="433" y="198" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">tolerancję innych kotów, stres podczas podróży i kontakt awaryjny</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Właściciel mówi, że kot 'nigdy nie chorował', ale nie pamięta</text><text x="433" y="335" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">ostatnich dokumentów i przyznaje, że zwierzę nie toleruje obcych kotów</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Napisz formularz przyjęcia kota z ośmioma pytaniami i zasadą</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">reagowania na brak odpowiedzi ważnej dla dobrostanu.</text></svg>