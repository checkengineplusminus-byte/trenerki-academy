<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Drewno: przekrój pnia i słoje"><rect width="960" height="540" fill="#f7f9f3"/><rect x="24" y="24" width="912" height="492" rx="22" fill="#ffffff" stroke="#cddccd" stroke-width="3"/><text x="57" y="81" fill="#1b4b34" font-family="Arial" font-size="30" font-weight="bold">Drewno: przekrój pnia i słoje</text><text x="57" y="113" fill="#627d66" font-family="Arial" font-size="17">Zrozum kierunek włókien i wpływ skurczu na materiał</text><circle cx="280" cy="319" r="160" fill="#ddbd8e" stroke="#996e44" stroke-width="15"/><circle cx="280" cy="319" r="128" fill="none" stroke="#ae895b" stroke-width="7"/><circle cx="280" cy="319" r="97" fill="none" stroke="#ad885a" stroke-width="7"/><circle cx="280" cy="319" r="67" fill="none" stroke="#ad885a" stroke-width="7"/><circle cx="280" cy="319" r="29" fill="#a47548" stroke="#8d6340" stroke-width="5"/><path d="M280 318L280 165M280 318L406 395" stroke="#72543b" stroke-width="4"/><text x="320" y="170" fill="#72543b" font-family="Arial" font-size="21">promień</text><text x="404" y="415" fill="#72543b" font-family="Arial" font-size="21">słoje</text><rect x="540" y="175" width="300" height="210" rx="16" fill="#eef3eb" stroke="#cbdacc" stroke-width="3"/><text x="570" y="224" fill="#22523b" font-family="Arial" font-weight="bold" font-size="23">ZAPAMIĘTAJ</text><text x="570" y="270" fill="#45644d" font-family="Arial" font-size="20">• włókna biegną wzdłuż pnia</text><text x="570" y="310" fill="#45644d" font-family="Arial" font-size="20">• skurcz zależy od kierunku</text><text x="570" y="350" fill="#45644d" font-family="Arial" font-size="20">• wada może zmienić nośność</text></svg>