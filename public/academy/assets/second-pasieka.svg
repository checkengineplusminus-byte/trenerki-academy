<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Miejsce i sąsiedztwo"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Miejsce i sąsiedztwo</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><path d="M126 227V74M128 144Q59 130 57 65q68 9 71 79M131 171q79-28 67-91q-67 10-67 91" fill="#adcfab" stroke="#719775" stroke-width="9"/><path d="M76 227h99" stroke="#947b59" stroke-width="10"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Lokalizację uli wybiera się, analizując pożytek, zacienienie, wiatr,</text><text x="433" y="198" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">dostęp do wody, ruch ludzi oraz możliwości dojazdu</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Plan przewiduje ustawienie uli tuż przy chodniku na granicy posesji,</text><text x="433" y="335" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">aby było blisko domu</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Narysuj plan działki z trzema możliwymi lokalizacjami uli i oceną:</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">woda, wiatr, słońce, sąsiedzi, droga dojazdowa.</text></svg>