<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Nagłówki i struktura"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Nagłówki i struktura</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><rect x="13" y="34" width="230" height="177" rx="9" fill="#e2eff1" stroke="#668b92" stroke-width="10"/><path d="M13 87h230M89 87v124M166 87v124M13 146h230" stroke="#a6c5cb" stroke-width="6"/><circle cx="37" cy="62" r="8" fill="#d4aa74"/><circle cx="62" cy="62" r="8" fill="#a6c69d"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Dostępny nagłówek jest elementem struktury H1/H2/H3</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">W raporcie tytuł i trzy podrozdziały wyglądają poprawnie, ale każdy</text><text x="433" y="335" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">jest zwykłym tekstem pogrubionym</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Ułóż hierarchię nagłówków raportu: tytuł, zakres, metodologia, wyniki</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">i wnioski. Sprawdź, czy kolejność jest logiczna.</text></svg>