<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Norweski budowlany: konkretne materiały, wymagania i potwierdzenie"><rect width="960" height="540" rx="26" fill="#f4f8f2"/><rect x="22" y="22" width="916" height="496" rx="24" fill="#ffffff" stroke="#d6e5d5" stroke-width="3"/><text x="55" y="70" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#214c35">Norweski budowlany: konkretne materiały, wymagania</text><text x="55" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#214c35">i potwierdzenie</text><rect x="52" y="145" width="305" height="302" rx="28" fill="#eaf3e7" stroke="#d4e5d0" stroke-width="3"/><g transform="translate(79 176) scale(1.0)"><path d="M21 48h214v126H96l-49 39v-39H21Z" fill="#e6f1e8" stroke="#668d77" stroke-width="9"/><text x="51" y="134" font-size="73" font-family="sans-serif" font-weight="bold" fill="#3a7153">Aa?</text></g><rect x="385" y="145" width="514" height="92" rx="17" fill="#eaf1e8" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="176" r="15" fill="#78a585"/><text x="410" y="182" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">1</text><text x="444" y="176" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">POZNAJ</text><text x="412" y="201" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Lær å skille między 'betong', 'mørtel', 'armering', 'treverk' i</text><text x="412" y="220" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">'stål'.</text></rect><rect x="385" y="250" width="514" height="92" rx="17" fill="#f3f6ef" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="281" r="15" fill="#78a585"/><text x="410" y="287" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">2</text><text x="444" y="281" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">ZASTOSUJ</text><text x="412" y="306" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">W Norwegii ważne są podstawy komunikacji HMS/SJA i prośba o</text><text x="412" y="325" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">doprecyzowanie.</text></rect><rect x="385" y="355" width="514" height="92" rx="17" fill="#eaf1e8" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="386" r="15" fill="#78a585"/><text x="410" y="392" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">3</text><text x="444" y="386" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">SPRAWDŹ</text><text x="412" y="411" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Pracownik słyszy prośbę o przeniesienie stali, ale nie zna wymiarów i</text><text x="412" y="430" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">miejsca.</text></rect><path d="M153 466h656" stroke="#c0d5be" stroke-width="4"/><text x="53" y="494" font-family="Arial,sans-serif" font-size="15" fill="#597361">Materiał → proces → kontrola wyniku</text></svg>