<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Dwa obwody — jeden wyrób"><rect width="960" height="540" fill="#f4f7f0"/><rect x="26" y="28" width="908" height="484" rx="18" fill="#ffffff" stroke="#cadacb" stroke-width="2"/><text x="58" y="82" font-size="29" font-family="Arial" font-weight="700" fill="#244c36">Dwa obwody — jeden wyrób</text><text x="58" y="112" font-size="17" font-family="Arial" fill="#58745d">Przykład: 20 klepek, średnice 600 i 500 mm</text><circle cx="271" cy="318" r="147" stroke="#986b44" stroke-width="10" fill="#e4c397"/><circle cx="271" cy="318" r="126" stroke="#ae8456" stroke-width="2" fill="none" stroke-dasharray="8 6"/><circle cx="615" cy="318" r="123" stroke="#986b44" stroke-width="10" fill="#e4c397"/><circle cx="615" cy="318" r="101" stroke="#ae8456" stroke-width="2" fill="none" stroke-dasharray="8 6"/><path d="M124 318h294 M492 318h246" stroke="#5e684a" stroke-width="2"/><text x="190" y="315" font-family="Arial" font-size="19" fill="#34553b">600 mm</text><text x="559" y="315" font-family="Arial" font-size="19" fill="#34553b">500 mm</text><text x="150" y="476" font-family="Arial" font-size="20" font-weight="bold" fill="#245638">C = 1885 mm → /20 ≈ 94,2</text><text x="505" y="476" font-family="Arial" font-size="20" font-weight="bold" fill="#245638">C = 1571 mm → /20 ≈ 78,5</text><text x="352" y="162" font-family="Arial" font-size="18" fill="#87603f">Wymiary średnie, nie szablon cięcia!</text></svg>