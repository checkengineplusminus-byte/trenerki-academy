<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Rachunkowość zawodowa"><rect width="960" height="540" rx="22" fill="#f4f7ef"/><rect x="20" y="20" width="920" height="500" rx="20" fill="white" stroke="#c9dbcb" stroke-width="3"/><text x="51" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#1e5239">Rachunkowość zawodowa</text><text x="51" y="108" font-family="Arial,sans-serif" font-size="18" fill="#546d5c">Procent dodatku, pensja za godziny i podział kwoty</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#578a66"/></marker></defs><g stroke="#b6d1ba" stroke-width="3" fill="#eef4eb"><rect x="71" y="172" width="822" height="80" rx="9"/><rect x="71" y="268" width="822" height="80" rx="9"/><rect x="71" y="364" width="822" height="80" rx="9"/></g><g font-family="Arial" font-size="24" fill="#285d3e"><text x="98" y="221">35 zł + 18% = 35 + 6,30 = 41,30 zł</text><text x="98" y="317">168 h × 9,50 zł/h = 1596 zł brutto</text><text x="98" y="414">7200 zł × 2/5 = 2880 zł dla drugiej zmiany</text></g></svg>