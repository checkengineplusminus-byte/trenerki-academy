<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Przełożenie pasowe bez poślizgu"><rect width="960" height="540" rx="22" fill="#f4f7ef"/><rect x="20" y="20" width="920" height="500" rx="20" fill="white" stroke="#c9dbcb" stroke-width="3"/><text x="51" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#1e5239">Przełożenie pasowe bez poślizgu</text><text x="51" y="108" font-family="Arial,sans-serif" font-size="18" fill="#546d5c">Silnik 1200 obr./min, koło 10 cm → wał 2400 obr./min, koło 5 cm</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#578a66"/></marker></defs><circle cx="232" cy="295" r="104" fill="#d7e0de" stroke="#547c82" stroke-width="13"/><circle cx="707" cy="295" r="55" fill="#d7e0de" stroke="#547c82" stroke-width="13"/><path d="M229 191L703 240M229 399L704 350" stroke="#c4a076" stroke-width="16"/><circle cx="232" cy="295" r="17" fill="#4f777b"/><circle cx="707" cy="295" r="17" fill="#4f777b"/><text x="159" y="458" font-family="Arial" font-size="21" fill="#315b43">10 cm · 1200/min</text><text x="628" y="425" font-family="Arial" font-size="21" fill="#315b43">5 cm · 2400/min</text><text x="310" y="495" font-family="Arial" font-size="22" fill="#b07e4c">n₁ × d₁ = n₂ × d₂</text></svg>