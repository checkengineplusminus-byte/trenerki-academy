<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Spadek połaci — oblicz z trójkąta"><rect width="960" height="540" fill="#f4f7f2"/><rect x="22" y="25" width="916" height="488" rx="18" fill="#fff" stroke="#d5ded5" stroke-width="2"/><text x="55" y="81" font-family="Arial" font-weight="bold" font-size="29" fill="#254b38">Spadek połaci — oblicz z trójkąta</text><text x="55" y="113" font-family="Arial" font-size="17" fill="#5c7965">Przykład: 3 m w poziomie + 1 m wzniosu = 3,162 m po skosie</text><path d="M168 400L680 400L680 229z" fill="#e6f0e8" stroke="#57826c" stroke-width="6"/><path d="M168 400L680 229" stroke="#9c673d" stroke-width="14"/><path d="M652 400v-28h28" stroke="#517567" fill="none" stroke-width="4"/><text x="362" y="441" font-family="Arial" font-size="24" fill="#284d39">3,0 m</text><text x="704" y="325" font-family="Arial" font-size="24" fill="#284d39">1,0 m</text><text x="344" y="259" font-family="Arial" font-size="25" fill="#9a6037" transform="rotate(-18 344 259)">3,162 m</text><path d="M235 400A67 67 0 0 0 231 378" fill="none" stroke="#46758f" stroke-width="5"/><text x="247" y="385" font-family="Arial" font-size="18" fill="#46758f">18,4°</text><text x="158" y="487" font-family="Arial" font-size="18" fill="#677a6b">Geometria to nie pozwolenie na montaż danego produktu na takim kącie</text></svg>