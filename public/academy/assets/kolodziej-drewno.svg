<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Dobór drewna do elementu"><rect width="960" height="540" fill="#f4f7f1"/><rect x="20" y="20" width="920" height="500" rx="17" fill="#fff" stroke="#d6dfd4" stroke-width="2"/><text x="46" y="70" font-family="Arial,sans-serif" font-size="30" fill="#264635" font-weight="700">Dobór drewna do elementu</text><text x="46" y="101" font-family="Arial,sans-serif" font-size="16" fill="#5c7664">Historyczny przykład: wiąz, dąb i jesion</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="75" y="158" width="244" height="294" rx="16" fill="#f2e8d4" stroke="#c9b18c" stroke-width="3"/><rect x="359" y="158" width="244" height="294" rx="16" fill="#e8f0e7" stroke="#b6d1b7" stroke-width="3"/><rect x="643" y="158" width="244" height="294" rx="16" fill="#e9edf2" stroke="#bdcddc" stroke-width="3"/><g fill="none" stroke="#9e7c58" stroke-width="5"><circle cx="197" cy="249" r="69"/><circle cx="197" cy="249" r="48"/><circle cx="197" cy="249" r="25"/><path d="M414 305l115-115M415 333l135-135M427 365l127-127"/><path d="M708 344Q763 247 836 203M707 370Q763 273 837 229M708 393Q763 298 837 255"/></g><g font-size="23" font-weight="700" fill="#285239"><text x="197" y="359">Wiąz — piasta</text><text x="481" y="359">Dąb — szprychy</text><text x="765" y="359">Jesion — dzwona</text></g><g font-size="16" fill="#5d6a60"><text x="197" y="390">Odporność na rozłupanie</text><text x="481" y="390">Sztywność i włókna</text><text x="765" y="390">Wytrzymałość i elastyczność</text></g></g><text x="70" y="489" font-family="Arial,sans-serif" font-size="16" fill="#667768">Dobór wymaga sprawdzenia konkretnego surowca i przeznaczenia koła</text></svg>