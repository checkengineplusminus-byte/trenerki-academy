<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Rola producenta i sprzedawcy"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Rola producenta i sprzedawcy</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><path d="M128 21l94 36v74q0 63-94 102Q34 194 34 131V57Z" fill="#dbeadf" stroke="#7c9b81" stroke-width="10"/><path d="M128 75v114M73 115h108M75 115l-28 46h56zM181 115l-29 46h56z" fill="#b7d1bf" stroke="#6a8d7b" stroke-width="6"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Trzeba ustalić, kto projektuje, produkuje, wprowadza i sprzedaje dany</text><text x="433" y="198" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">produkt oraz kto odpowiada za jego identyfikację i dokumentację</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Twórca wykonuje metalowy wieszak, oznacza go własną marką i sprzedaje</text><text x="433" y="335" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">online</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Przygotuj matrycę ról producenta, importera, dystrybutora i</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">sprzedawcy, zaznaczając jakie informacje trzeba zweryfikować dla</text></svg>