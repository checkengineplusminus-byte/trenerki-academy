<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Kalkulacja czasu i ceny"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Kalkulacja czasu i ceny</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><path d="M23 113L129 26l108 87" fill="none" stroke="#79a18b" stroke-width="15"/><path d="M52 108v118h159V108" fill="#e7eee3" stroke="#799b81" stroke-width="10"/><rect x="113" y="151" width="45" height="75" fill="#a9bfa6"/><rect x="70" y="145" width="27" height="27" fill="#9fbfc0"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Kalkulacja usługi obejmuje powierzchnię, rodzaje materiałów, stopień</text><text x="433" y="198" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">zabrudzenia, dostęp do wody i prądu, czas dojazdu, środki i kontrolę</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Lokal A ma 60 m² gładkich podłóg, a B także 60 m², ale szkło, kamienne</text><text x="433" y="335" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">blaty i zabrudzenia po remoncie</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Policz hipotetyczne zlecenie: 4 h pracy po 60 zł, materiały 35 zł,</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">dojazd 40 zł; dopisz koszt kontroli jakości i rezerwę.</text></svg>