    <path d="M70 298h369" stroke="#7f462a" stroke-width="3"/>
    <path d="M434 291l9 7-9 7" fill="none" stroke="#7f462a" stroke-width="3"/>
    <rect x="524" y="248" width="382" height="32" fill="#e5c191" stroke="#9b6e47" stroke-width="3"/>
    <path d="M570 281h34v98h-34zm128 0h34v98h-34zm128 0h34v98h-34z" fill="#598171" stroke="#386b56" stroke-width="3"/>
