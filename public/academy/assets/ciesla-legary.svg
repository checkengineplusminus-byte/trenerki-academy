<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Deski i legary · widok z góry oraz przekrój</title>
  <desc id="desc">Deski poszycia przebiegają prostopadle do trzech legarów. Po prawej przekrój pokazuje oddzielnie deskę i podpory.</desc>
  <rect width="960" height="540" rx="18" fill="#f4f8ef"/>
  <g font-family="system-ui,sans-serif" fill="#173b2b">
    <text x="44" y="61" font-size="32" font-weight="700">Podłoga na legarach</text>
    <text x="44" y="98" font-size="17">Przykładowy układ do nauki czytania rysunku.</text>
    <text x="59" y="155" font-size="20" font-weight="700">RZUT Z GÓRY</text>
    <text x="524" y="155" font-size="20" font-weight="700">PRZEKRÓJ WZDŁUŻ DESKI</text>
    <rect x="59" y="176" width="405" height="242" fill="#e5c191" stroke="#9b6e47" stroke-width="3"/>
