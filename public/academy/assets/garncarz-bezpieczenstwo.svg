<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Pracownia: oddziel strefy ryzyka"><rect width="960" height="540" fill="#f5f7ef"/><rect x="26" y="30" width="908" height="480" rx="17" fill="#fff" stroke="#cad8c9" stroke-width="2"/><text x="60" y="83" font-size="29" font-family="Arial" font-weight="bold" fill="#294f3d">Pracownia: oddziel strefy ryzyka</text><text x="60" y="113" font-size="17" font-family="Arial" fill="#587562">Pył respirabilny, obszar mokry i gorący piec wymagają osobnej kontroli</text><rect x="90" y="171" width="225" height="220" rx="12" fill="#e7efe5" stroke="#9dbb9d" stroke-width="3"/><rect x="367" y="171" width="225" height="220" rx="12" fill="#e4f0ed" stroke="#9dbb9d" stroke-width="3"/><rect x="644" y="171" width="225" height="220" rx="12" fill="#f7e8df" stroke="#cd9e85" stroke-width="3"/><g font-family="Arial" text-anchor="middle" font-size="22" fill="#31583f"><text x="202" y="221">Suche składniki</text><text x="479" y="221">Formowanie</text><text x="757" y="221">Piec</text></g><g font-family="Arial" text-anchor="middle" font-size="17" fill="#617261"><text x="202" y="267">Kontrola pyłu</text><text x="479" y="267">Czyszczenie na mokro</text><text x="757" y="267">Wentylacja i odstępy</text><text x="202" y="305">Odpowiedni odciąg</text><text x="479" y="305">Koło i narzędzia</text><text x="757" y="305">Uprawniony operator</text></g><text x="113" y="455" font-family="Arial" font-size="18" fill="#536e58">Schemat organizacyjny, nie plan przeciwpożarowy konkretnej pracowni.</text></svg>