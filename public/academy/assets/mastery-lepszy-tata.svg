<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Obecność i więź: rytuały, rozmowa i granice"><rect width="960" height="540" rx="26" fill="#f4f8f2"/><rect x="22" y="22" width="916" height="496" rx="24" fill="#ffffff" stroke="#d6e5d5" stroke-width="3"/><text x="55" y="70" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#214c35">Obecność i więź: rytuały, rozmowa i granice</text><rect x="52" y="145" width="305" height="302" rx="28" fill="#eaf3e7" stroke="#d4e5d0" stroke-width="3"/><g transform="translate(79 176) scale(1.0)"><circle cx="88" cy="82" r="33" fill="#95b9a0"/><circle cx="168" cy="72" r="42" fill="#c7ab83"/><path d="M25 222q8-108 65-108q38 0 57 40q25-46 58-38q39 31 30 106" fill="#e8eee5" stroke="#6f9a82" stroke-width="7"/></g><rect x="385" y="145" width="514" height="92" rx="17" fill="#eaf1e8" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="176" r="15" fill="#78a585"/><text x="410" y="182" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">1</text><text x="444" y="176" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">POZNAJ</text><text x="412" y="201" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Poczucie bezpieczeństwa budują przewidywalne zachowania rodzica, nie</text><text x="412" y="220" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">drogie prezenty.</text></rect><rect x="385" y="250" width="514" height="92" rx="17" fill="#f3f6ef" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="281" r="15" fill="#78a585"/><text x="410" y="287" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">2</text><text x="444" y="281" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">ZASTOSUJ</text><text x="412" y="306" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Zaplanuj regularny czas bez telefonu, rozmowy dostosowane do wieku i</text><text x="412" y="325" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">prosty rytuał…</text></rect><rect x="385" y="355" width="514" height="92" rx="17" fill="#eaf1e8" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="386" r="15" fill="#78a585"/><text x="410" y="392" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">3</text><text x="444" y="386" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">SPRAWDŹ</text><text x="412" y="411" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Ojciec spóźnia się na umówioną rozmowę i tłumaczy, że dziecko</text><text x="412" y="430" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">'przesadza'.</text></rect><path d="M153 466h656" stroke="#c0d5be" stroke-width="4"/><text x="53" y="494" font-family="Arial,sans-serif" font-size="15" fill="#597361">Materiał → proces → kontrola wyniku</text></svg>