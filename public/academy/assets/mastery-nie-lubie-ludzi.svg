l,sans-serif" font-size="15" fill="#3e624b">Przeanalizuj konkretne sytuacje: co wydarzyło się naprawdę, jakie było</text><text x="412" y="325" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">moje…</text></rect><rect x="385" y="355" width="514" height="92" rx="17" fill="#eaf1e8" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="386" r="15" fill="#78a585"/><text x="410" y="392" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">3</text><text x="444" y="386" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">SPRAWDŹ</text><text x="412" y="411" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Jedna przykra rozmowa powoduje przekonanie, że 'wszyscy ludzie są</text><text x="412" y="430" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">fałszywi'.</text></rect><path d="M153 466h656" stroke="#c0d5be" stroke-width="4"/><text x="53" y="494" font-family="Arial,sans-serif" font-size="15" fill="#597361">Materiał → proces → kontrola wyniku</text></svg>