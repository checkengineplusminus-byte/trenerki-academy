<text x="68" y="89" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#173e2d">Kopyto konia — nazwy struktur</text>
<text x="68" y="123" font-family="Arial,sans-serif" font-size="20" fill="#587565">Poglądowy schemat rozpoznawania, nie instrukcja zabiegu</text>

<rect x="85" y="168" width="465" height="381" rx="22" fill="#f0f4ef" stroke="#cbd7ca" stroke-width="3"/>
<text x="112" y="209" fill="#215239" font-family="Arial" font-size="24" font-weight="bold">Widok od spodu — schemat</text>
