<text x="612" y="209" fill="#215239" font-family="Arial" font-size="25" font-weight="bold">Jak uczyć się bezpiecznie?</text>
<text x="620" y="263" fill="#385f47" font-family="Arial" font-size="22">1. Poznaj nazwy i funkcję struktur.</text><text x="620" y="314" fill="#385f47" font-family="Arial" font-size="22">2. Zrozum mechanikę ruchu konia.</text><text x="620" y="365" fill="#385f47" font-family="Arial" font-size="22">3. Obserwuj pracę podkuwacza.</text><text x="620" y="416" fill="#385f47" font-family="Arial" font-size="22">4. Nie wykonuj zabiegów samodzielnie.</text><text x="620" y="467" fill="#385f47" font-family="Arial" font-size="22">5. W razie bólu konsultuj weterynarza.</text>
<text x="112" y="578" fill="#705d4a" font-family="Arial" font-size="19">Rysunek uproszczony i nieanatomiczny — służy tylko nauce nazewnictwa.</text>
<text x="68" y="616" font-family="Arial,sans-serif" font-size="16" fill="#54715d">TRENERKI Academy · autorski schemat edukacyjny · nie zastępuje szkolenia praktycznego</text>
</svg>