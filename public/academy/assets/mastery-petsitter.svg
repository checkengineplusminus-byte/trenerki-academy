<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Wizyta opiekuna kota: nawodnienie, leki i reakcja na zagrożenia"><rect width="960" height="540" rx="26" fill="#f4f8f2"/><rect x="22" y="22" width="916" height="496" rx="24" fill="#ffffff" stroke="#d6e5d5" stroke-width="3"/><text x="55" y="70" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#214c35">Wizyta opiekuna kota: nawodnienie, leki i reakcja</text><text x="55" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#214c35">na zagrożenia</text><rect x="52" y="145" width="305" height="302" rx="28" fill="#eaf3e7" stroke="#d4e5d0" stroke-width="3"/><g transform="translate(79 176) scale(1.0)"><path d="M49 109L60 33l53 36q21-5 35 0l46-36 11 75q14 36-11 74q-35 48-91 28q-70-21-54-101Z" fill="#cbb49a" stroke="#87765f" stroke-width="8"/><ellipse cx="96" cy="124" rx="9" ry="14" fill="#4d6a59"/><ellipse cx="157" cy="124" rx="9" ry="14" fill="#4d6a59"/><path d="M115 151l12 9 12-9" fill="#a37c72"/></g><rect x="385" y="145" width="514" height="92" rx="17" fill="#eaf1e8" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="176" r="15" fill="#78a585"/><text x="410" y="182" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">1</text><text x="444" y="176" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#235a3d">POZNAJ</text><text x="412" y="201" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">Zachowanie kota, jedzenie, woda, kuweta i oddech są ważnymi danymi</text><text x="412" y="220" font-family="Arial,sans-serif" font-size="15" fill="#3e624b">obserwacyjnymi.</text></rect><rect x="385" y="250" width="514" height="92" rx="17" fill="#f3f6ef" stroke="#d8e5d7" stroke-width="2"/><circle cx="416" cy="281" r="15" fill="#78a585"/><text x="410" y="287" font-family="Arial,sans-serif" font-size="15" fill="#ffffff" font-weight="bold">2</text><text x="444" y="281" font-