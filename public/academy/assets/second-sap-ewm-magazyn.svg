<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Co widać po zalogowaniu: menu i role"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Co widać po zalogowaniu: menu i role</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><path d="M28 40v195M222 40v195M28 78h194M28 141h194M28 209h194" stroke="#759b8b" stroke-width="13"/><rect x="52" y="88" width="65" height="40" fill="#d4b382" stroke="#9c7549" stroke-width="5"/><rect x="137" y="88" width="65" height="40" fill="#d4b382" stroke="#9c7549" stroke-width="5"/><rect x="84" y="157" width="92" height="39" fill="#b3c9ad" stroke="#6f9677" stroke-width="5"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Role i obszary pracy pozwalają obsługiwać przyjęcia, zapas, warehouse</text><text x="433" y="198" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">tasks i monitor magazynu</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Pracownik otrzymuje zadanie odłożenia HU do lokacji A-01-03, ale widzi</text><text x="433" y="335" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">tam inną paletę</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Na schemacie rozdziel: warehouse number, storage type, storage bin, HU</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">i warehouse task. Wyjaśnij związek każdego z nich.</text></svg>