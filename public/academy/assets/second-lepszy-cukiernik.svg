<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Ważenie i proporcje"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Ważenie i proporcje</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><circle cx="130" cy="120" r="102" fill="#e5f0e0" stroke="#779b7d" stroke-width="10"/><circle cx="130" cy="120" r="64" fill="#fff" stroke="#b6cfb8" stroke-width="8"/><path d="M88 132q36-67 89 0q-42 43-89 0" fill="#d8b47d"/><path d="M205 50v100M223 54v100" stroke="#9ca98e" stroke-width="7"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">W recepturze kontroluje się masę składników, liczbę porcji, wielkość</text><text x="433" y="198" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">formy oraz stan surowców</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Przepis na 8 porcji wymaga 240 g mąki i 160 g cukru</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Przelicz cztery składniki z 8 na 12 porcji i zapisz, które parametry</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">pozostają do sprawdzenia podczas pieczenia.</text></svg>