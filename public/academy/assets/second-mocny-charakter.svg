<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" role="img" aria-label="Twoje zasady i wartości"><rect width="1040" height="580" fill="#f4f8f2"/><rect x="24" y="20" width="992" height="536" rx="25" fill="#fff" stroke="#d4e2d4" stroke-width="3"/><text x="59" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1d4c36">Twoje zasady i wartości</text><rect x="55" y="111" width="329" height="370" rx="25" fill="#eaf2e7" stroke="#c9dec8" stroke-width="3"/><g transform="translate(86 165) scale(1.03)"><rect x="32" y="33" width="191" height="195" rx="10" fill="#e9eee3" stroke="#8eae92" stroke-width="9"/><path d="M32 86h191M69 17v32M186 17v32" stroke="#739782" stroke-width="11"/><path d="M57 119h22M57 158h22M101 119h94M101 158h94" stroke="#abc6b0" stroke-width="10"/></g><text x="77" y="452" font-family="Arial,sans-serif" font-size="19" fill="#41735c" font-weight="bold">PRZYKŁAD DO PRZEANALIZOWANIA</text><rect x="410" y="111" width="573" height="123" rx="17" fill="#eef3e9"/><rect x="410" y="248" width="573" height="123" rx="17" fill="#eaf2ed"/><rect x="410" y="385" width="573" height="124" rx="17" fill="#f7f4e9"/><text x="432" y="148" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">1 · ZROZUM</text><text x="432" y="285" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#315e46">2 · ROZPOZNAJ SYTUACJĘ</text><text x="432" y="422" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#77623f">3 · SPRÓBUJ</text><text x="433" y="174" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Wartości to zasady ważne przy podejmowaniu decyzji, a nie slogany</text><text x="433" y="311" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Pracownik deklaruje 'zależy mi na bezpieczeństwie', ale nie zgłasza</text><text x="433" y="335" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">niesprawnego sprzętu z obawy przed opóźnieniem</text><text x="433" y="448" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">Wybierz trzy wartości i dla każdej opisz trudną sytuację, konkretny</text><text x="433" y="472" font-family="Arial,sans-serif" font-size="17" fill="#455f4d">wybór i koszt tego wyboru.</text></svg>