<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Geometria koła — liczby i znaczenie"><rect width="960" height="540" fill="#f4f7f1"/><rect x="20" y="20" width="920" height="500" rx="17" fill="#fff" stroke="#d6dfd4" stroke-width="2"/><text x="46" y="70" font-family="Arial,sans-serif" font-size="30" fill="#264635" font-weight="700">Geometria koła — liczby i znaczenie</text><text x="46" y="101" font-family="Arial,sans-serif" font-size="16" fill="#5c7664">D=900 mm, 16 szprych, 8 dzwon</text><circle cx="285" cy="308" r="147" fill="#ecdfc4" stroke="#956f4b" stroke-width="10"/><line x1="138" y1="308" x2="432" y2="308" stroke="#3d6e54" stroke-width="4"/><path d="M285 308L432 308M285 308L421 364" stroke="#588578" stroke-width="6"/><path d="M340 308A55 55 0 0 1 335.8 329" fill="none" stroke="#c27b42" stroke-width="5"/><g font-family="Arial,sans-serif" fill="#2a543c"><text x="193" y="289" font-size="23" font-weight="bold">900 mm</text><text x="324" y="345" font-size="21">22,5°</text></g><rect x="494" y="156" width="398" height="291" rx="16" fill="#eaf2e7"/><g font-family="Arial,sans-serif" fill="#28513d"><text x="526" y="217" font-size="24" font-weight="700">C = π × D ≈ 2827,4 mm</text><text x="526" y="270" font-size="24" font-weight="700">360° / 16 = 22,5°</text><text x="526" y="323" font-size="22">Łuk dzwona ≈ 353,4 mm</text><text x="526" y="370" font-size="22">Cięciwa ≈ 344,4 mm</text><text x="526" y="417" font-size="16">Nie są to wymiary pasowania obręczy!</text></g></svg>