<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Długość i masa — dwa różne pomiary"><rect width="960" height="540" fill="#f3f7f1"/><rect x="23" y="24" width="914" height="490" rx="18" fill="#fff" stroke="#c7dccb" stroke-width="2"/><text x="54" y="76" font-family="Arial" font-size="30" font-weight="bold" fill="#28533a">Długość i masa — dwa różne pomiary</text><text x="54" y="109" font-family="Arial" font-size="17" fill="#5e7b67">Długość początkowa z hipotetycznym skróceniem 12%</text><rect x="70" y="177" width="378" height="270" rx="16" fill="#f2ecdc"/><rect x="505" y="177" width="378" height="270" rx="16" fill="#e8f2ea"/><g font-family="Arial" fill="#2c553c"><text x="99" y="233" font-size="22">Długość gotowa</text><text x="99" y="275" font-size="36" font-weight="bold">30 m</text><text x="99" y="337" font-size="20">30 / (1−0,12)</text><text x="99" y="376" font-size="32" font-weight="bold">≈ 34,09 m</text><text x="530" y="233" font-size="22">Masa liniowa</text><text x="530" y="275" font-size="33" font-weight="bold">0,18 kg/m</text><text x="530" y="337" font-size="20">30 × 0,18</text><text x="530" y="376" font-size="32" font-weight="bold">= 5,4 kg</text></g><text x="102" y="482" font-family="Arial" font-size="16" fill="#687d6b">Liczby dydaktyczne — nie wartości procesu produkcyjnego</text></svg>