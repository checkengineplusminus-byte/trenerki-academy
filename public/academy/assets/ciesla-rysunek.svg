<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Rysunek i kontrola prostokątności"><rect width="960" height="540" fill="#f7f9f3"/><rect x="24" y="24" width="912" height="492" rx="22" fill="#ffffff" stroke="#cddccd" stroke-width="3"/><text x="57" y="81" fill="#1b4b34" font-family="Arial" font-size="30" font-weight="bold">Rysunek i kontrola prostokątności</text><text x="57" y="113" fill="#627d66" font-family="Arial" font-size="17">Przykład: rama 3 × 4 m, przekątna 5 m</text><rect x="210" y="177" width="500" height="305" fill="#e8f0ea" stroke="#507d5f" stroke-width="9"/><path d="M210 482L710 177" stroke="#be8858" stroke-width="6" stroke-dasharray="17 9"/><text x="470" y="300" font-family="Arial" fill="#925d32" font-size="28" font-weight="bold">5 m</text><path d="M210 155h500M190 177v305" stroke="#3c6e58" stroke-width="4"/><text x="450" y="148" font-family="Arial" fill="#246140" font-size="26">4 m</text><text x="155" y="352" font-family="Arial" fill="#246140" font-size="26" transform="rotate(-90 155 352)">3 m</text><text x="726" y="300" font-family="Arial" fill="#5b755e" font-size="18">Kontroluj obie przekątne</text></svg>