function homeHTML(){return `<section class="hero"><div class="wrap hero-in"><div><div class="eyebrow"><i class="dot"></i> TRENERKI • nauka bez zadęcia</div><h1>Nie tylko przeczytaj.<br/><span>Naucz się naprawdę.</span></h1><p class="hero-desc">Poznaj temat, poćwicz na sytuacjach z życia i sprawdź, czy naprawdę umiesz podjąć dobrą decyzję. W nauce towarzyszy Ci Trenerka — spokojnie, po ludzku i bez zawstydzania.</p><div class="hero-actions">${button('Wybierz, czego chcesz się nauczyć →',`scrollToSection('kursy')`,'btn-dark')}${button('Zobacz jak uczymy ↗',`scrollToSection('jak-dziala')`,'btn-outline')}</div><div class="trust-strip"><span>Praktyczne sytuacje</span><span>Ćwiczenia po każdej lekcji</span><span>Certyfikat PL + EN</span></div></div><div class="hero-art" aria-hidden="true"><div class="art-circle"><div class="art-core"><div class="art-letters">T.</div><div><div class="art-label">TRENERKI</div><div class="line"></div><br/><div class="line short"></div></div><div style="font-weight:800;font-size:12px;color:#c6ebac">ODKRYJ • PRZEĆWICZ • ZROZUM</div></div></div><div class="float-card one"><span class="bubble">${avatarSVG(46)}</span><div><strong>Cześć, jestem Trenerka</strong><small>Poprowadzę Cię krok po kroku</small></div></div><div class="float-card two"><span class="bubble">✦</span><div><strong>To coś więcej niż test</strong><small>Problemy z pracy, decyzje, rozmowy</small></div></div></div></div></section><section class="section" id="kursy"><div class="wrap"><div class="section-head"><div><div class="overline">Wybierz swój kierunek</div><h2>To przyda Ci się w prawdziwym życiu.</h2><p>Nie uczymy na pamięć. Uczymy rozpoznawać problemy i działać z głową.</p></div></div><div class="filter-line"><div class="search"><span>⌕</span><input aria-label="Szukaj kursu" id="course-search" placeholder="Czego chcesz się nauczyć?" value="${esc(query)}" oninput="searchCourses(this.value)"/></div><div class="chips" id="chips"></div></div><div class="cards" id="course-cards"></div></div></section><section class="section features" id="jak-dziala"><div class="wrap"><div class="section-head"><div><div class="overline">Jak uczymy?</div><h2>Przećwicz to, zanim spotka Cię naprawdę.</h2></div></div><div class="feature-grid"><div class="feature"><div class="feature-ico">✎</div><h3>Zaczynamy od zaskoczenia</h3><p>Krótka ciekawostka i prosty przykład pokazują, dlaczego temat jest ważny. Potem konkretne wskazówki i trudności, o których zwykle się nie mówi.</p></div><div class="feature"><div class="feature-ico">↗</div><h3>Ćwiczysz przez 8 etapów</h3><p>Czytasz, podejmujesz decyzję, zapisujesz rozwiązanie i rozwiązujesz krótki quiz. Następny etap otwiera się po zrozumieniu poprzedniego.</p></div><div class="feature"><div class="feature-ico">☺</div><h3>Rozmawiasz z Trenerką</h3><p>Przed egzaminem czeka Cię pięciopytaniowa rozmowa na konkretnym przypadku. Potem mieszany egzamin i dwujęzyczne potwierdzenie ukończenia.</p></div></div></div></section><section class="section" id="certyfikat"><div class="wrap"><div class="cta-band"><div><div class="overline" style="color:#d1ed9d">TRENERKI ACADEMY</div><h2>Najpierw umiejętności.<br/>Potem dokument.</h2><p>Certyfikat PL/EN ma potwierdzić ukończenie prywatnego kursu. Największą wartością jest to, co potrafisz zrobić po nauce.</p></div>${button('Otwórz kursy →',`scrollToSection('kursy')`,'btn-lime')}</div><div class="legal-notice"><strong>Informacja o kursach.</strong> Płatności i zapisy są jeszcze przygotowywane. Materiały edukacyjne nie są równoznaczne z uprawnieniami zawodowymi. Dokument ukończenia będzie potwierdzeniem prywatnego szkolenia, a nie państwowym certyfikatem.</div></div></section>`}

function cardHTML(c){let st=courseState(c.id);let progress=hasAccess(c.id)?st.done.length:0;return `<article class="course-card"><div class="card-media" style="background:${c.accent}"><span class="card-flag">${esc(c.flag)}</span><span class="card-emoji" role="img" aria-label="Ikona kursu">${c.emoji}</span>${courseIllustration(c)}</div><div class="card-body"><div class="card-category">${esc(c.cat)} • 8 lekcji</div><h3 class="card-title">${esc(c.title)}</h3><p class="card-desc">${esc(c.short)}</p><div style="display:flex;gap:7px;flex-wrap:wrap">${hasAccess(c.id)&&st.passed?'<span class="pill">🏆 Egzamin zaliczony</span>':progress?`<span class="pill">${progress}/8 etapów zaliczonych</span>`:'<span class="pill">Testy + egzamin</span>'}<span class="pill">${esc(c.duration)}</span></div><div class="card-foot"><span class="price">${money(c.price)} <small>/ kurs</small></span><button class="btn-inline" onclick="openCourse('${c.id}')">${hasAccess(c.id)?'Kontynuuj ↗':'Poznaj kurs ↗'}</button></div></div></article>`}

function updateCatalog(){let cats=['Wszystkie',...new Set(COURSES.map(c=>c.cat))];$('#chips').innerHTML=cats.map(x=>`<button class="chip ${filter===x?'active':''}" onclick="setFilter('${x}')">${esc(x)}</button>`).join('');let result=COURSES.filter(c=>(filter==='Wszystkie'||c.cat===filter)&&(`${c.title} ${c.short} ${c.cat}`).toLocaleLowerCase('pl').includes(query.toLocaleLowerCase('pl')));$('#course-cards').innerHTML=result.length?result.map(cardHTML).join(''):'<div class="empty">Nie znaleziono takiego tematu. Spróbuj innych słów.</div>'}
function setFilter(x){filter=x;updateCatalog()};function searchCourses(v){query=v;updateCatalog()};function goHome(e,target){if(e)e.preventDefault();page='home';selectedCourse=null;render();if(target)setTimeout(()=>scrollToSection(target),20)}function showCatalog(){goHome(null,'kursy')}function scrollToSection(id){$('#'+id)?.scrollIntoView({behavior:'smooth',block:'start'})};
function openCourse(id){coachOpen=false;clearInterval(roleTimer);page='course';selectedCourse=COURSES.find(c=>c.id===id);selectedStep=hasAccess(id)?Math.min(courseState(id).lastStep||0,7):0;mode='lesson';result=null;quizAnswers={};render();window.scrollTo({top:0,behavior:'smooth'})};

function courseHTML(){let c=selectedCourse,st=courseState(c.id);return `<div class="wrap page-top"><a class="crumb" onclick="showCatalog()">← Wszystkie kursy <span style="color:#a2b2a5">/</span> ${esc(c.cat)}</a><div class="course-titleblock"><div><div class="overline">${esc(c.flag)} • ${esc(c.cat)}</div><h1 class="course-heading">${esc(c.title)}</h1><p class="course-summary">${esc(c.short)}. Każdy etap daje wiedzę, zadanie praktyczne i krótką kontrolę zrozumienia. Przed egzaminem sprawdzisz się w rozmowie z Trenerką.</p><div class="award-name"><span>Na certyfikacie / On your certificate</span><strong>${esc(c.certificate_title_pl)}</strong><em>${esc(c.certificate_title_en)}</em></div><div class="course-meta"><span class="pill">8 × nauka + test</span><span class="pill">Rozmowa z 5 pytaniami</span><span class="pill">Egzamin zmienny</span><span class="pill">Certyfikat PL/EN</span></div>${c.id==='kierownik-budowy'?`<div class="course-disclaimer">Ten kurs doskonali praktyczne umiejętności. Nie nadaje uprawnień budowlanych ani prawa do pełnienia samodzielnych funkcji technicznych.</div>`:''}</div><aside class="buy-card"><div class="overline">Nauka we własnym tempie</div><div class="big">${money(c.price)}</div><p>${hasAccess(c.id)?`Dostęp demonstracyjny ważny do ${formatDate(accessEntry(c.id).expiresAt)}. Wracaj w dowolnym momencie.`:'Załóż konto już teraz. Zakupy uruchomimy w kolejnym etapie. Płatny dostęp będzie ważny 12 miesięcy.'}</p><button class="btn btn-dark" onclick="${hasAccess(c.id)?'resumeCourse()':'openCheckout()'}">${hasAccess(c.id)?'Kontynuuj naukę':'Zaloguj się / załóż konto'} ↗</button><button class="btn btn-outline" style="margin-top:9px" onclick="openLibrary()">Moje kursy</button><p class="fine">Płatności będą dostępne wkrótce</p></aside></div></div>${hasAccess(c.id)?`<section class="learn-area scrolltop" id="learn-area"><div class="wrap learn-layout"><aside class="sidebar"><div class="side-title">TWOJA DROGA DO UMIEJĘTNOŚCI</div><div class="progress-head"><span>Etapy praktyki</span><span>${st.done.length}/8</span></div><div class="progressbar"><i style="width:${st.done.length*12.5}%"></i></div>${c.modules.map((m,i)=>`<button class="module-btn ${selectedStep===i&&['lesson','quiz'].includes(mode)?'sel':''} ${st.done.includes(i)?'done':''}" ${i>st.done.length?'disabled':''} onclick="jumpStep(${i})"><span class="num">${st.done.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><span><span class="mod-name">${esc(m[0])}</span><small class="mod-sub">${st.done.includes(i)?'Zaliczony':'Nauka, ćwiczenie i quiz'}</small></span></button>`).join('')}<button class="module-btn ${mode==='roleplay'?'sel':''}" ${st.done.length<8?'disabled':''} onclick="roleplayStart()"><span class="num">☺</span><span><span class="mod-name">Rozmowa z Trenerką</span><small class="mod-sub">5 pytań • 5 minut</small></span></button><button class="module-btn ${mode==='exam'?'sel':''}" ${st.done.length<8||!st.roleplayDone?'disabled':''} onclick="startExam()"><span class="num">★</span><span><span class="mod-name">Egzamin końcowy</span><small class="mod-sub">16 losowanych pytań</small></span></button>${st.passed?`<button class="module-btn ${mode==='cert'?'sel':''}" onclick="showCert()"><span class="num">🏆</span><span><span class="mod-name">Certyfikat PL / EN</span><small class="mod-sub">Przykładowy dokument</small></span></button>`:''}</aside><section class="lesson" id="lesson-view">${mode==='roleplay'?roleplayHTML():mode==='exam'?examHTML():mode==='cert'?certHTML():lessonHTML()}</section></div></section>${coachWidget()}`:`<section class="wrap"><div class="lock-card"><div class="overline">Nauka po zakupie</div><h2>Twój kurs czeka na Ciebie</h2><p>Po opłaceniu kursu zobaczysz osiem etapów, testy, rozmowę sytuacyjną i egzamin. Dostęp zachowasz przez 12 miesięcy, a postęp zapisze się na Twoim koncie.</p><button class="btn btn-dark" onclick="openCheckout()">Załóż konto →</button><p class="tiny-muted">Płatności nie są jeszcze aktywne. Nie podawaj danych karty.</p></div></section>`}`;}

function render(){const app=$('#app');app.innerHTML=page==='home'?homeHTML():courseHTML();if(page==='home')updateCatalog();document.title=page==='home'?'TRENERKI Academy — Kursy praktyczne i umiejętności':selectedCourse.title+' — TRENERKI Academy';}
function openCheckout(){const code=selectedCourse?.id;window.location.assign('/konto'+(code?'?course='+encodeURIComponent(code):''));}
function openLibrary(e){if(e)e.preventDefault();window.location.assign('/moje-kursy');}
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#modal-root').innerHTML='';});
render();

const _catalogEndpoint='https://kcvvixcjuwglfvdpypzs.supabase.co/rest/v1/ta_courses?select=slug,title_pl,description_pl,price_grosze&published=eq.true';
fetch(_catalogEndpoint,{headers:{apikey:'sb_publishable_wpRp2JuWNW_WcjZdWXwIRQ_HfCPlxrj',accept:'application/json'}})
 .then(async res=>{if(!res.ok)throw new Error('catalog_fetch_failed');return res.json()})
 .then(rows=>{
  if(!Array.isArray(rows))return;
  const bySlug=new Map(rows.map(row=>[row.slug,row]));
  for(const c of COURSES){
   const row=bySlug.get(c.id);
   if(!row)continue;
   if(typeof row.title_pl==='string'&&row.title_pl.trim())c.title=row.title_pl;
   if(typeof row.description_pl==='string'&&row.description_pl.trim())c.short=row.description_pl;
   if(Number.isInteger(row.price_grosze)&&row.price_grosze>=0)c.price=row.price_grosze/100;
  }
  if(page==='home')updateCatalog();
  else if(selectedCourse)render();
 })
 .catch(()=>{}); // Render original course catalog as a safe fallback during outages.

</script>
</body>
</html>
