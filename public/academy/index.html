/* v0.4 — library, checkout and learning access */
.library-shell{min-height:65vh;padding:70px 0 100px}.library-intro{margin-bottom:28px}.library-intro p{max-width:730px;color:#607965;margin-top:12px}.library-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.library-card{padding:23px;background:#fff;border:1px solid #e0e9da;border-radius:19px;box-shadow:0 4px 16px #17322809}.library-card h3{margin-bottom:12px}.library-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.library-card p{color:#667968;font-size:13px;margin-top:10px}.meter{height:9px;border-radius:40px;background:#e9f0e3;overflow:hidden;margin:14px 0 7px}.meter>span{display:block;height:100%;background:linear-gradient(90deg,#639d6c,#b8e676);border-radius:40px;transition:width .35s}.labelrow{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#4b6856;font-weight:700;font-size:12px}.checkout-form{display:grid;gap:12px;margin:18px 0}.checkout-form label{display:block;font-weight:800;font-size:12px;color:#33503d;margin-bottom:5px}.checkout-form input[type=text],.checkout-form input[type=email]{width:100%;border:1px solid #cbdcc5;border-radius:11px;padding:12px 14px;background:#fff;color:#193729}.checkout-form .consent{display:flex;align-items:flex-start;gap:10px;font-weight:500;line-height:1.5;font-size:12px;color:#506656}.checkout-form .consent input{margin-top:4px;flex-shrink:0}.legal-links{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:15px}.legal-links a,.checkout-form a{text-decoration:underline;text-underline-offset:3px;color:#285b3a}.lock-card{padding:30px;max-width:720px;background:#fff;border:1px solid #dce8d6;border-radius:20px;margin:0 auto 60px;text-align:center}.lock-card h2{font-size:30px}.lock-card p{color:#607765;max-width:600px;margin:15px auto}.lock-card .btn{margin:8px}.button-save{display:inline-flex;gap:9px;align-items:center;margin:0 0 16px;padding:10px 14px;background:#e9f2df;border:1px solid #ccdec3;color:#204b33;border-radius:10px;font-weight:800}.legal-pages-mini{margin-top:18px;display:flex;flex-wrap:wrap;gap:9px}.checkout-strong{padding:14px 16px;border-radius:13px;background:#eef5e7;color:#32553a;font-weight:700;font-size:12px}.modal{max-height:92vh;overflow-y:auto}.privacy-tag{font-size:11px;color:#617b65}.demo-warning{margin:12px 0;padding:12px;border:1px solid #e6d6a5;border-radius:12px;background:#fff9e8;font-size:12px;color:#735722}

<script>
'use strict';
const PREVIEWS={"brygadzista":{"course_slug":"brygadzista","curiosity":"Dobra odprawa trwa krótko, ale jej brak potrafi zepsuć cały dzień na budowie.","scenario":"Dwóch pracowników czeka na materiał, a inna ekipa już chce wejść na ten sam podest. Kto i co ustala najpierw?","outcome_1":"Przydzielisz pracę tak, żeby nikt nie zgadywał, za co odpowiada.","outcome_2":"Poprowadzisz konkretną odprawę i zauważysz ryzyko przed rozpoczęciem pracy.","outcome_3":"Zapiszesz opóźnienia i ustalenia bez obwiniania ludzi.","source_url":null},"kierownik-budowy":{"course_slug":"kierownik-budowy","curiosity":"Najdroższe błędy na budowie często zaczynają się od niepotwierdzonej zmiany.","scenario":"Produkcja pracuje według starego rysunku, a na budowie jest już nowa rewizja. Co robisz?","outcome_1":"Ułożysz plan zależności zamiast listy życzeń.","outcome_2":"Nauczysz się rozpoznawać zmianę, która wymaga pisemnego potwierdzenia.","outcome_3":"Przećwiczysz rozmowę o opóźnieniu bez szukania winnych.","source_url":null},"lepszy-szef":{"course_slug":"lepszy-szef","curiosity":"Ludzie rzadko czytają w myślach szefa — nawet najlepsi potrzebują jasnych oczekiwań.","scenario":"Mówisz „zrób to dobrze”, ale trzy osoby rozumieją to inaczej. Co zmienisz?","outcome_1":"Zaczniesz delegować wynik, termin i odpowiedzialność.","outcome_2":"Przećwiczysz trudny feedback bez upokarzania.","outcome_3":"Ułożysz plan rozmowy, gdy zespół traci zaufanie.","source_url":null},"apartamenty":{"course_slug":"apartamenty","curiosity":"Gość nie widzi Twojej listy kontrolnej — widzi jeden włos w łazience.","scenario":"Gość przyjeżdża za 40 minut, a poprzedni zostawił uszkodzoną lampę.","outcome_1":"Zbudujesz listę kontroli gotowości apartamentu.","outcome_2":"Nauczysz się dokumentować szkody i zmiany stanu lokalu.","outcome_3":"Przećwiczysz spokojną komunikację z gościem.","source_url":null},"gpsr":{"course_slug":"gpsr","curiosity":"Mały handmade nie oznacza, że bezpieczeństwo produktu można pominąć.","scenario":"Sprzeda ie pyta dziecka, czy było grzeczne — najpierw okazuje mu życzliwość.","scenario":"Dziecko boi się brody i nie chce podejść. Jak zachowasz świąteczny nastrój bez naciskania?","outcome_1":"Przygotujesz bezpieczną wizytę.","outcome_2":"Przećwiczysz ciepłe rozmowy z dziećmi.","outcome_3":"Ułożysz listę małych dobrych uczynków.","source_url":null},"lepszy-tata":{"course_slug":"lepszy-tata","curiosity":"Dziecko nie potrzebuje taty idealnego. Potrzebuje taty, do którego może wrócić także po trudnym dniu.","scenario":"Odbierasz dziecko po tygodniu rozłąki, a ono zamiast przytulenia mówi tylko „cześć”.","outcome_1":"Zaczniesz rozmawiać bez naciskania na odpowiedź.","outcome_2":"Zbudujesz wspólne rytuały nawet w dwóch domach.","outcome_3":"Przećwiczysz spokojne granice i naprawianie relacji.","source_url":"https://www.unicef.org/parenting/child-care/11-tips-communicating-your-teen"},"lepsza-mama":{"course_slug":"lepsza-mama","curiosity":"Dbanie o własną równowagę nie jest przeciwieństwem troski o dziecko.","scenario":"Po trudnym dniu dziecko potrzebuje uwagi właśnie wtedy, gdy Ty nie masz już siły.","outcome_1":"Nauczysz się mówić o emocjach bez obwiniania.","outcome_2":"Znajdziesz małe sposoby na wspólny spokojny czas.","outcome_3":"Przećwiczysz granice i proszenie o wsparcie.","source_url":"https://www.unicef.org/parenting/child-care/11-tips-communicating-your-teen"},"word-skroty":{"course_slug":"word-skroty","curiosity":"Skróty w Wordzie to nie tylko szybkie kopiowanie — pomagają przygotować czytelne pismo bez szukania przycisków w menu.","scenario":"Piszesz podanie, masz dziesięć minut, a nagłówki, akapity i odstępy wyglądają inaczej na każdej stronie. Jak to uporządkować bez przeklikiwania wstążki?","outcome_1":"Sformatujesz pismo, CV lub notatkę za pomocą najczęściej używanych skrótów.","outcome_2":"Zobaczysz graficznie, które klawisze nacisnąć i jaki będzie rezultat.","outcome_3":"Poznasz wskazówki pozwalające uniknąć przypadkowego formatowania i przyspieszyć pracę.","source_url":"https://support.microsoft.com/pl-pl/accessibility/word/keyboard-shortcuts-in-word"},"wyjdz-z-toksycznego-zwiazku":{"course_slug":"wyjdz-z-toksycznego-zwiazku","curiosity":"Nie każda kłótnia oznacza przemoc. Ale powtarzające się zastraszanie, kontrola pieniędzy i odcinanie od bliskich to sygnały, których nie warto bagatelizować.","scenario":"Partner czyta Twoje wiadomości i mówi, że bez tego nie ma zaufania. Zaczynasz ukrywać zwykłe rozmowy z przyjaciółmi, żeby uniknąć awantury.","outcome_1":"Odróżnisz konflikt od wzorca kontroli i przemocy.","outcome_2":"Przećwiczysz stawianie granic i szukanie wsparcia bez ryzykownej konfrontacji.","outcome_3":"Ułożysz indywidualny, bezpieczny plan kolejnych kroków.","source_url":"https://www.gov.pl/web/gov/skorzystaj-z-pomocy-dla-osob-dotknietych-przemoca-w-rodzinie","editorial_note":"Twoje bezpieczeństwo i autonomia są pierwsze. Nie zalecamy konfrontacji z osobą stosującą przemoc bez oceny ryzyka ani nie nakazujemy pozostawania czy odchodzenia. W bezpośrednim zagrożeniu dzwoń 112; w Polsce Niebieska Linia 800 120 002 (całodobowo). Kurs nie zastępuje pomocy prawnej i psychologicznej."},"kryzys-po-40-bez-dlugow":{"course_slug":"kryzys-po-40-bez-dlugow","curiosity":"Zmiana życia nie wymaga od razu nowego auta ani kredytu. Czasem najtańszym krokiem jest sprawdzenie, co naprawdę chcesz zmienić.","scenario":"Po czterdziestce myślisz o nowym samochodzie i biznesie. Raty wyglądają na dostępne, ale nie policzyłeś napraw, podatków i słabszych miesięcy.","outcome_1":"Policzysz pełny koszt decyzji, a nie tylko pierwszą ratę.","outcome_2":"Rozpoznasz presję porównywania się i impulsywne zakupy.","outcome_3":"Ułożysz bezpieczny plan zmiany na 90 dni.","source_url":"https://uokik.gov.pl/public/kupie-teraz-zaplace-pozniej-jak-wyprzedaze-zadluzaja-porady-uokik","editorial_note":"Ambicja jest ważna, ale zdrowie i stabilność finansowa mają pierwszeństwo. Nie pożyczaj pod wpływem presji, nie poręczaj zobowiązań bez analizy. Materiał edukacyjny, nie spersonalizowana porada inwestycyjna ani kredytowa."},"partner-z-uzaleznieniem":{"course_slug":"partner-z-uzaleznieniem","curiosity":"Nie możesz wytrzeźwieć za drugą osobę. Możesz jednak szukać wsparcia, chronić własne granice i nie brać na siebie odpowiedzialności za jej leczenie.","scenario":"Bliska osoba znów obiecuje zmianę po nocy spędzonej na piciu. Ty tłumaczysz nieobecność w pracy, ukrywasz problem przed dziećmi i nie wiesz, co robić dalej.","outcome_1":"Poznasz różnicę między pomocą a przejmowaniem cudzych obowiązków.","outcome_2":"Przećwiczysz spokojną rozmowę i przygotujesz listę instytucji wsparcia.","outcome_3":"Ocenisz swoje opcje, bezpieczeństwo i potrzeby dzieci bez presji pozostania w związku.","source_url":"https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/treatment-alcohol-problems-finding-and-getting-help","editorial_note":"Nie obciążamy bliskich winą za uzależnienie drugiej osoby. Bezpieczeństwo dorosłych i dzieci jest ważniejsze niż utrzymanie relacji za wszelką cenę. Odstawianie alkoholu po długim intensywnym piciu może wymagać pomocy medycznej. Kurs nie jest terapią ani instrukcją odstawiania substancji; w niebezpieczeństwie wzywaj służby ratunkowe."},"nie-marnuj-jedzenia":{"course_slug":"nie-marnuj-jedzenia","curiosity":"Czerstwy, ale bezpieczny chleb może stać się grzankami, a ugotowane ziemniaki — podstawą nowego obiadu. Nie chodzi o jedzenie za wszelką cenę, lecz o plan.","scenario":"W lodówce zostały pół papryki, ugotowany ryż z poprzedniego dnia i trzy jajka. Zanim coś ugotujesz, musisz sprawdzić, jak te produkty były przechowywane.","outcome_1":"Odróżnisz datę jakości od terminu bezpieczeństwa żywności.","outcome_2":"Ułożysz trzy proste przepisy z produktów, które już masz.","outcome_3":"Policzysz koszt porcji i ograniczysz przypadkowe zakupy.","source_url":"https://www.gov.pl/web/gis/najlepiej-spozyc-przed-nalezy-spozyc-do-co-to-oznacza-i-do-kiedy-produkt-moze-znajdowac-sie-w-obrocie","editorial_note":"Oszczędzanie nie może zagrażać zdrowiu. Produktów po terminie „należy spożyć do” nie używaj. W razie nieprawidłowego przechowywania lub oznak zepsucia wyrzuć żywność; nie polegaj wyłącznie na zapachu. Uwzględniaj alergeny i higienę."},"trawnik-jestem-ogrodnikiem":{"course_slug":"trawnik-jestem-ogrodnikiem","curiosity":"Żółty trawnik nie zawsze jest martwy. W czasie suszy część traw przechodzi w stan spoczynku, a nadmierne podlewanie może marnować wodę.","scenario":"Po upalnym tygodniu trawa zrobiła się brązowa. Sąsiad mówi, żeby lać wodę codziennie i skosić nisko, a Ty nie wiesz, czy to pomoże.","outcome_1":"Rozpoznasz wpływ gleby, cienia i pogody na trawę.","outcome_2":"Ułożysz rozsądny plan koszenia i podlewania dla lokalnych warunków.","outcome_3":"Zdiagnozujesz częste problemy bez kupowania preparatów w ciemno.","source_url":"https://www.rhs.org.uk/lawns/mowing","editorial_note":"Pielęgnację dopasuj do gatunku trawy, klimatu, gleby, suszy oraz lokalnych ograniczeń wody i środków ochrony roślin. Nie kosimy mokrego ani zamarzniętego trawnika. Chemia nie zastępuje diagnozy; wspieramy bioróżnorodność i zapylacze."},"ekonomia-domowa-bez-dlugow":{"course_slug":"ekonomia-domowa-bez-dlugow","curiosity":"Mała rata bywa kosztowną decyzją, gdy zsumujesz opłaty, ubezpieczenie i czas spłaty. W domowym budżecie liczy się cały koszt, nie reklama.","scenario":"Rodzinie zostaje 900 zł po opłaceniu rachunków. Jeden domownik chce kupić sprzęt w ratach, drugi boi się nieplanowanego rachunku za samochód.","outcome_1":"Sporządzisz realny budżet z podziałem na konieczne i odraczalne wydatki.","outcome_2":"Porównasz koszt pożyczki, rat i odroczonej płatności.","outcome_3":"Przygotujesz plan awaryjny na gorszy miesiąc i listę źródeł bezpłatnej pomocy.","source_url":"https://uokik.gov.pl/public/kupie-teraz-zaplace-pozniej-jak-wyprzedaze-zadluzaja-porady-uokik","editorial_note":"Kurs nie oferuje produktów finansowych ani gwarancji wyjścia z zadłużenia. Przed decyzją sprawdzaj pełny koszt kredytu, RRSO i aktualne warunki. W kryzysie warto wcześnie kontaktować się z wierzycielem oraz niezależnym, bezpłatnym doradztwem; nie zaciągaj kolejnego długu bez oceny możliwości spłaty."},"angielski-na-budowie":{"course_slug":"angielski-na-budowie","curiosity":"Na brytyjskiej budowie pierwszą umiejętnością nie jest rozumienie rysunków. Jest umiejętność powiedzenia: «I don't understand» i poproszenia o pomoc.","scenario":"Masz pierwszy dzień w UK. Kto prowadzi site induction, czy potrzebujesz CSCS i jak zapytasz o toaletę i drogę ewakuacji?","outcome_1":"Zaczniesz od alfabetu i prostych zdań z wymową oraz przyciskiem odsłuchu.","outcome_2":"Przejdziesz przez zwykły dzień na budowie — od wejścia po uporządkowanie stanowiska.","outcome_3":"Poznasz zasady bezpieczeństwa, podstawowe skróty, oficjalne stawki i miejsca uzyskania pomocy.","source_url":"https://www.hse.gov.uk/construction/","editorial_note":"Nie zgaduj przy poleceniach bezpieczeństwa. Gdy nie rozumiesz instrukcji, poproś o tłumacza lub ponowne wyjaśnienie; słownik nie zastępuje szkolenia BHP.","history":null,"module_titles":["Od zera — alfabet i pierwsze słowa w pracy","Pierwszy dzień — wejście, CSCS i instruktaż","Plan budowy — wejście, toaleta, wyjście","Bezpieczeństwo — PPE, RAMS i site induction","Poznaj ekipę — pytania zwykłego pracownika","Narzędzia i materiały po angielsku","Liczby, wymiary i godziny pracy","W codziennej pracy — pytaj, proś, potwierdzaj","STOP — zagrożenia i numer alarmowy","Prawa pracownika — stawki, umowa, payslip","Opóźnienia, rysunki i brak materiału","Zakończenie zmiany i raport"]},"norweski-na-budowie":{"course_slug":"norweski-na-budowie","curiosity":"Nie musisz znać norweskiego, żeby zacząć uczyć się bezpiecznie pracować. Znasz już trzy najważniejsze słowa: «hei», «hjelp» i «stopp».","scenario":"Wchodzisz pierwszy raz na budowę w Norwegii. Gdzie się zgłosić, co to karta HMS i gdzie sprawdzić stawkę, gdy jeszcze nie umiesz mówić?","outcome_1":"Zaczniesz od alfabetu i prostych zdań z wymową oraz przyciskiem odsłuchu.","outcome_2":"Przejdziesz przez zwykły dzień na budowie — od wejścia po uporządkowanie stanowiska.","outcome_3":"Poznasz zasady bezpieczeństwa, podstawowe skróty, oficjalne stawki i miejsca uzyskania pomocy.","source_url":"https://www.arbeidstilsynet.no/","editorial_note":"W sprawach HMS, SJA, podnoszenia ładunków i pracy na wysokości stosuj aktualne wymagania norweskie; nauka języka nie zastępuje wymaganych kursów.","history":null,"module_titles":["Zacznij od zera — alfabet i pierwsze słowa","Pierwszy dzień — wejście i karta HMS","Poznaj plac — wejście, toaleta, apteczka","HMS, SJA, SHA, KS — co oznaczają?","Ekipa — porozmawiaj jak zwykły pracownik","Narzędzia i materiały od podstaw","Liczby, godziny i wymiary","Dzień pracy — pytania, zadania, przerwy","STOP — zagrożenie i wezwanie pomocy","Twoje prawa, minimalne stawki i wypłata","Dostawy, zmiany i zgłaszanie problemów","Koniec zmiany — porządek i przekazanie"]},"niemiecki-na-budowie":{"course_slug":"niemiecki-na-budowie","curiosity":"Pierwsza lekcja w Niemczech zaczyna się od «Hallo». Dopiero później poznasz skróty PSA i SiGeKo oraz pytania o własne prawa.","scenario":"Zaczynasz pracę w Niemczech. Nie znasz jeszcze niemieckiego, nie rozumiesz Unterweisung i chcesz się dowiedzieć, jakie obowiązują zasady.","outcome_1":"Zaczniesz od alfabetu i prostych zdań z wymową oraz przyciskiem odsłuchu.","outcome_2":"Przejdziesz przez zwykły dzień na budowie — od wejścia po uporządkowanie stanowiska.","outcome_3":"Poznasz zasady bezpieczeństwa, podstawowe skróty, oficjalne stawki i miejsca uzyskania pomocy.","source_url":"https://www.bgbau.de/","editorial_note":"Niemieckie zasady BHP i wymagania do pracy mogą różnić się od polskich; tłumaczenie polecenia nie jest dowodem uprawnienia.","history":null,"module_titles":["Od zera — alfabet i pierwsze słowa","Pierwszy dzień — wejście i instruktaż w Niemczech","Gdzie iść? Biuro, toaleta i drogi piesze","Bezpieczeństwo: PSA, SiGePlan, Unterweisung","Rozmowy zwykłego pracownika na budowie","Narzędzia i materiały po niemiecku","Liczby, wymiary i godziny","Dzień pracy — pytania i zadania","Wypadek i zagrożenie — co mówić","Umowa, płaca minimalna i rozliczenie","Zmiany planu, dostawy i problemy","Koniec pracy — sprzątanie i przekazanie"]},"pomagaj-dziecku-w-lekcjach":{"course_slug":"pomagaj-dziecku-w-lekcjach","curiosity":"Kiedy dziecko samo odkryje pierwszy krok rozwiązania, uczy się więcej niż wtedy, gdy dorosły poda mu gotowy wynik.","scenario":"Zadanie tekstowe ma pięć zdań — Poproś dziecko o opowiedzenie treści własnymi słowami.","outcome_1":"Przećwiczysz: jak poznać prawdziwą trudność.","outcome_2":"Nauczysz się stosować wiedzę w sytuacjach: pomagaj bez podawania odpowiedzi.","outcome_3":"Zaplanujesz własne ćwiczenie i sprawdzisz, kiedy potrzebna jest pomoc specjalisty lub instruktora.","source_url":"https://www.unicef.org/parenting/child-care/9-tips-for-better-communication","editorial_note":"Nie wykonuj zadań za dziecko, nie zawstydzaj go i nie uzależniaj miłości od ocen. Stosuj wymagania szkolne odpowiednie do wieku i potrzeb, szczególnie przy ADHD lub trudnościach w nauce.","history":null},"windows-skroty":{"course_slug":"windows-skroty","curiosity":"Kombinacja Windows + E otwiera Eksplorator plików — czasem dwa klawisze oszczędzają minutę codziennego szukania.","scenario":"Win + Shift + S — Otwórz narzędzie do zaznaczenia zrzutu.","outcome_1":"Przećwiczysz: szybka zmiana aplikacji.","outcome_2":"Nauczysz się stosować wiedzę w sytuacjach: ustawienia i wyszukiwanie.","outcome_3":"Zaplanujesz własne ćwiczenie i sprawdzisz, kiedy potrzebna jest pomoc specjalisty lub instruktora.","source_url":"https://support.microsoft.com/pl-pl/windows/skróty-klawiaturowe-w-systemie-windows-dcc61a57-8ff0-cffe-9796-cb9706c75eec","editorial_note":"Skróty zależą od wersji systemu i ustawień klawiatury. Pokazujemy Windows 11 na standardowym układzie; nie udostępniaj poufnych zrzutów ani zawartości schowka.","history":null} ,"source_url":"https://help.sap.com/docs/SAP_EXTENDED_WAREHOUSE_MANAGEMENT"},"oracle-wms-cloud":{"course_slug":"oracle-wms-cloud","curiosity":"W Oracle WMS LPN i wave mogą decydować, czy magazyn zdąży z zamówieniem, mimo pełnych regałów.","scenario":"System widzi zapas, ale wave nie przydziela ostatniej paczki. Co wymaga sprawdzenia?","outcome_1":"Poznasz ASN, LPN, location i statusy zapasu.","outcome_2":"Przejdziesz przez alokację, wave, pick, pack i shipping.","outcome_3":"Przećwiczysz analizę short pick, statusów i ryzyka terminu.","source_url":"https://docs.oracle.com/en/cloud/saas/warehouse-management/"},"manhattan-active-wms":{"course_slug":"manhattan-active-wms","curiosity":"W Manhattan ActiveWarehouse jeden zator przy rampie może wpłynąć na pracę sorterów i kompletacji.","scenario":"Fala jest gotowa, a pakowanie i załadunek stoją. Czy problem jest w pracy ludzi czy w statusach?","outcome_1":"Poznasz inventory i fulfilment w środowisku Manhattan.","outcome_2":"Przećwiczysz receiving, waving, picking, loading i yard.","outcome_3":"Zrozumiesz slotting, labor i koordynację automatyki.","source_url":"https://www.manh.com/solutions/supply-chain-management-software/warehouse-management"},"blue-yonder-wms":{"course_slug":"blue-yonder-wms","curiosity":"Blue Yonder łączy pracę ludzi, skanerów i maszyn — algorytm nie zastępuje kontroli operatora.","scenario":"System podaje szybką trasę, ale jedna alejka jest zamknięta. Co poprawisz?","outcome_1":"Poznasz przepływ towaru i podstawowe pojęcia WMS.","outcome_2":"Nauczysz się system-directed picking, pack i load building.","outcome_3":"Zrozumiesz WES, slotting, Robotics Hub i zarządzanie zasobami.","source_url":"https://blueyonder.com/solutions/warehouse-management"},"infor-wms":{"course_slug":"infor-wms","curiosity":"W magazynie 3PL dwie identyczne pozycje mogą należeć do różnych firm. Zły właściciel oznacza realny błąd.","scenario":"Jedna ciężarówka przywiozła towary dwóch klientów: jak zapobiec wymieszaniu ich stanów?", function courseIllustration(c){const build=c.cat==='Budownictwo';return `<svg class="course-illustration" viewBox="0 0 190 90" aria-hidden="true"><circle cx="150" cy="28" r="26" fill="#ffffff77"/><path d="M15 75H178" stroke="#315846" stroke-opacity=".3" stroke-width="2"/>${build?`<path d="M51 73V22H67V73M51 35H67M51 50H67M51 63H67M59 22H143M118 22L139 16M140 15V61" stroke="#34624c" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M135 61H145V68H135Z" fill="#789f61"/><path d="M89 72V45H127V72M98 45V38H118V45" fill="#fdfdf4" stroke="#34624c" stroke-width="2"/>`:`<rect x="38" y="17" width="113" height="58" rx="10" fill="#fcfff4" stroke="#527e5f" stroke-width="3"/><path d="M51 34H117M51 46H138M51 58H108" stroke="#9eb993" stroke-width="5" stroke-linecap="round"/><circle cx="141" cy="30" r="10" fill="#d8f69b"/>`}</svg>`}

function homeHTML(){return `<section class="hero"><div class="wrap hero-in"><div><div class="eyebrow"><i class="dot"></i> TRENERKI • nauka bez zadęcia</div><h1>Nie tylko przeczytaj.<br/><span>Naucz się naprawdę.</span></h1><p class="hero-desc">Poznaj temat, poćwicz na sytuacjach z życia i sprawdź, czy naprawdę umiesz podjąć dobrą decyzję. W nauce towarzyszy Ci Anielka — Twoja trenerka życiowych przemian i sukcesów. Spokojnie, po ludzku i bez zawstydzania.</p><div class="hero-actions">${button('Wybierz, czego chcesz się nauczyć →',`scrollToSection('kursy')`,'btn-dark')}${button('Zobacz jak uczymy ↗',`scrollToSection('jak-dziala')`,'btn-outline')}</div><div class="trust-strip"><span>Praktyczne sytuacje</span><span>Ćwiczenia po każdej lekcji</span><span>Potwierdzenia ukończenia w przygotowaniu</span></div></div><div class="hero-art" aria-hidden="true"><div class="art-circle"><div class="art-core"><div class="art-letters">T.</div><div><div class="art-label">TRENERKI</div><div class="line"></div><br/><div class="line short"></div></div><div style="font-weight:800;font-size:12px;color:#c6ebac">ODKRYJ • PRZEĆWICZ • ZROZUM</div></div></div><div class="float-card one"><span class="bubble">${avatarSVG(46)}</span><div><strong>Cześć, to ja Anielka!</strong><small>Twoja trenerka przemian i sukcesów w życiu.</small></div></div><div class="float-card two"><span class="bubble">✦</span><div><strong>To coś więcej niż test</strong><small>Problemy z pracy, decyzje, rozmowy</small></div></div></div></div></section><section class="section" id="kursy"><div class="wrap"><div class="section-head"><div><div class="overline">Wybierz swój kierunek</div><h2>To przyda Ci się w prawdziwym życiu.</h2><p>Nie uczymy na pamięć. Uczymy rozpoznawać problemy i działać z głową.</p></div></div><div class="filter-line"><div class="search"><span>⌕</span><input aria-label="Szukaj kursu" id="course-search" placeholder="Czego chcesz się nauczyć?" value="${esc(query)}" oninput="searchCourses(this.value)"/></div><div class="chips" id="chips"></div></div><div class="cards" id="course-cards"></div></div></section><section class="section features" id="jak-dziala"><div class="wrap"><div class="section-head"><div><div class="overline">Jak uczymy?</div><h2>Przećwicz to, zanim spotka Cię naprawdę.</h2></div></div><div class="feature-grid"><div class="feature"><div class="feature-ico">✎</div><h3>Zaczynamy od zaskoczenia</h3><p>Krótka ciekawostka i prosty przykład pokazują, dlaczego temat jest ważny. Potem konkretne wskazówki i trudności, o których zwykle się nie mówi.</p></div><div class="feature"><div class="feature-ico">↗</div><h3>Uczysz się krok po kroku</h3><p>Poznajesz temat, rozwiązujesz sytuację z życia i zapisujesz własne wnioski. Do lekcji możesz wracać we własnym tempie; w ćwiczeniach od razu zobaczysz, co zrozumiałeś.</p></div><div class="feature"><div class="feature-ico">☺</div><h3>Rozmawiasz z Anielką</h3><p>Po każdym przykładzie podejmiesz decyzję i sprawdzisz jej rezultat. Uczysz się we własnym tempie.</p></div></div></div></section><section class="section" id="certyfikat"><div class="wrap"><div class="cta-band"><div><div class="overline" style="color:#d1ed9d">TRENERKI ACADEMY</div><h2>Najpierw umiejętności.<br/>Potem dokument.</h2><p>Planujemy dokument potwierdzający ukończenie prywatnego kursu w języku polskim i angielskim. Nie będzie on uprawnieniem zawodowym. Najważniejsze jest to, czego naprawdę nauczysz się w praktyce.</p></div>${button('Otwórz kursy →',`scrollToSection('kursy')`,'btn-lime')}</div><div class="legal-notice"><strong>Informacja o kursach.</strong> Płatności są wyłączone; administrator może symulować zakup za 0 zł, a kurs darmowy odbierzesz na swoim koncie. Materiały edukacyjne nie są równoznaczne z uprawnieniami zawodowymi. Dokument ukończenia będzie potwierdzeniem prywatnego szkolenia, a nie państwowym certyfikatem.</div></div></section>`}

function cardHTML(c){let st=courseState(c.id);let progress=hasAccess(c.id)?st.done.length:0;return `<article class="course-card"><div class="card-media" style="background:${c.accent}"><span class="card-flag">${esc(c.flag)}</span><span class="card-emoji" role="img" aria-label="Ikona kursu">${c.emoji}</span>${courseIllustration(c)}</div><div class="card-body"><div class="card-category">${esc(c.cat)} • ${c.outline?.length||8} lekcji</div><h3 class="card-title">${esc(c.title)}</h3><p class="card-desc">${esc(c.short)}</p><div style="display:flex;gap:7px;flex-wrap:wrap">${hasAccess(c.id)&&st.passed?'<span class="pill">🏆 Egzamin zaliczony</span>':progress?`<span class="pill">${progress}/${c.outline?.length||8} lekcji zaliczonych</span>`:`<span class="pill">${c.outline?.length||8} lekcji i ćwiczenia</span>`}<span class="pill">${esc(c.duration)}</span></div><div class="card-foot"><span class="price">${money(c.price)} <small>${c.price===0?'/ bezpłatnie':'/ kurs'}</small></span><button class="btn-inline" onclick="openCourse('${c.id}')">Poznaj kurs</button></div><button class="btn btn-dark btn-buy-card" onclick="startPurchase('${c.id}')">${c.price===0?'Odbierz za darmo':'Kup kurs'}</button></div></article>`}

function updateCatalog(){let cats=['Wszystkie',...new Set(COURSES.map(c=>c.cat))];$('#chips').innerHTML=cats.map(x=>`<button class="chip ${filter===x?'active':''}" onclick="setFilter('${x}')">${esc(x)}</button>`).join('');let result=COURSES.filter(c=>(filter==='Wszystkie'||c.cat===filter)&&(`${c.title} ${c.short} ${c.cat}`).toLocaleLowerCase('pl').includes(query.toLocaleLowerCase('pl')));$('#course-cards').innerHTML=result.length?result.map(cardHTML).join(''):'<div class="empty">Nie znaleziono takiego tematu. Spróbuj innych słów.</div>'}
function startPurchase(id){const c=COURSES.find(x=>x.id===id);if(!c)return;window.location.assign('/konto?course='+encodeURIComponent(id)+'&next=kup');}
function setFilter(x){filter=x;updateCatalog()};function searchCourses(v){query=v;updateCatalog()};
function goHome(e,target,record=true){if(e)e.preventDefault();page='home';selectedCourse=null;
 if(record&&window.history?.pushState){const url=new URL(window.location.href);url.searchParams.delete('course');window.history.pushState({},'',url.pathname+url.search+url.hash);}
 render();if(target)setTimeout(()=>scrollToSection(target),20);
}
function showCatalog(){goHome(null,'kursy')}
function scrollToSection(id){$('#'+id)?.scrollIntoView({behavior:'smooth',block:'start'})};
function openCourse(id,record=true){
 const course=COURSES.find(c=>c.id===id);if(!course){showCatalog();return;}
 coachOpen=false;clearInterval(roleTimer);page='course';selectedCourse=course;selectedStep=0;mode='lesson';result=null;quizAnswers={};
 if(record&&window.history?.pushState){const url=new URL(window.location.href);url.searchParams.set('course',id);window.history.pushState({},'',url.pathname+url.search+url.hash);}
 render();window.scrollTo({top:0,behavior:'smooth'});
}


function keyboardTeaserHTML(c){
 const demos={
  'word-skroty':[
    {keys:['Ctrl','B'],effect:'Pogrub tekst',before:'ważna wiadomość',after:'wiadomość pogrubiona'},
    {keys:['Ctrl','Alt','1'],effect:'Styl Nagłówek 1',before:'Tytuł zwykłym tekstem',after:'Nagłówek o prawdziwej strukturze'},
    {keys:['Ctrl','E'],effect:'Wyśrodkuj akapit',before:'Tytuł do lewej',after:'Tytuł wyśrodkowany'}],
  'autocad-skroty':[
    {keys:['L','Enter'],effect:'LINE — narysuj odcinek',before:'Puste miejsce na rysunku',after:'Pojawia się odcinek A–B',alias:true},
    {keys:['F8'],effect:'ORTHO — rysowanie w osiach',before:'Dowolny kierunek kursora',after:'Kursor trzyma osie'},
    {keys:['Ctrl','S'],effect:'Zapisz rysunek',before:'Niezapisane zmiany',after:'Plik DWG zapisany'}],
  'excel-skroty':[
    {keys:['Ctrl','T'],effect:'Zamień zakres na tabelę',before:'Komórki z nagłówkami',after:'Tabela z filtrami'},
    {keys:['Alt','='],effect:'Autosuma',before:'Kolumna liczb bez sumy',after:'Proponowana formuła SUMA'},
    {keys:['Ctrl','Home'],effect:'Początek arkusza',before:'Kursor na dole tabeli',after:'Aktywna komórka A1'}]
 };
 const group=demos[c.id];
 if(!group)return '';
 const cards=group.map(s=>{
  const keys=s.keys.map((k,i)=>(i?'<span class="keyboard-separator">'+(s.alias?'→':'+')+'</span>':'')+'<kbd>'+esc(k)+'</kbd>').join('');
  return '<div class="keyboard-teaser-card"><div class="keyboard-teaser-keys">'+keys+'</div><h3>'+esc(s.effect)+'</h3><div class="keyboard-teaser-contrast"><span><small>PRZED</small>'+esc(s.before)+'</span><span><small>PO</small><strong>'+esc(s.after)+'</strong></span></div></div>';
 }).join('');
 return '<section class="wrap keyboard-teaser"><div class="overline">Zobacz, jak uczymy skrótów</div><h2>Najpierw klawisze. Potem prawdziwy efekt.</h2><p class="keyboard-teaser-intro">Nie musisz wyobrażać sobie, co robi polecenie. Każdy skrót pokazujemy jako klawisze oraz zmianę przed i po jego użyciu. Pełna lista, wskazówki i ćwiczenia są w lekcjach.</p><div class="keyboard-teaser-grid">'+cards+'</div><p class="keyboard-teaser-disclaimer">Pokazywane klawisze dotyczą programu dla Windows. W AutoCAD wpisz alias i potwierdź Enterem, a kombinacje Ctrl naciskaj jednocześnie. Szczegóły zależą od wersji programu i ustawień.</p></section>';
}
function courseHTML(){let c=selectedCourse,st=courseState(c.id);return `<div class="wrap page-top"><a class="crumb" onclick="showCatalog()">← Wszystkie kursy <span style="color:#a2b2a5">/</span> ${esc(c.cat)}</a><div class="course-titleblock"><div><div class="overline">${esc(c.flag)} • ${esc(c.cat)}</div><h1 class="course-heading">${esc(c.title)}</h1><p class="course-summary">${esc(c.short)}. Zobacz, czego się nauczysz i przećwicz proste sytuacje z codziennego życia. Po aktywacji kursu zapiszesz swój postęp i wrócisz do lekcji, kiedy zechcesz.</p><div class="award-name"><span>Planowane potwierdzenie ukończenia / Course completion record</span><strong>${esc(c.certificate_title_pl)}</strong><em>${esc(c.certificate_title_en)}</em></div><div class="course-meta"><span class="pill">${c.outline?.length||8} lekcji praktycznych</span><span class="pill">Ćwiczenia do samodzielnego wykonania</span><span class="pill">Sprawdziany w przygotowaniu</span><span class="pill">Potwierdzenie ukończenia w przygotowaniu</span></div>${c.id==='kierownik-budowy'?`<div class="course-disclaimer">Ten kurs doskonali praktyczne umiejętności. Nie nadaje uprawnień budowlanych ani prawa do pełnienia samodzielnych funkcji technicznych.</div>`:''}</div><aside class="buy-card"><div class="overline">Nauka we własnym tempie</div><div class="big">${money(c.price)}</div><p>${hasAccess(c.id)?`Dostęp demonstracyjny ważny do ${formatDate(accessEntry(c.id).expiresAt)}. Wracaj w dowolnym momencie.`:'Najpierw poznaj temat i zdecyduj. Obecnie płatne kursy możesz testować na koncie administratora przez 14 dni, bez wpłaty i faktury. Prawdziwe płatności uruchomimy później.'}</p><button class="btn btn-dark" onclick="${hasAccess(c.id)?'resumeCourse()':'openCheckout()'}">${hasAccess(c.id)?'Kontynuuj naukę':'Kup kurs'} ↗</button><button class="btn btn-outline" style="margin-top:9px" onclick="openLibrary()">Moje kursy</button><p class="fine">Wersja testowa • za płatne kursy nie pobieramy pieniędzy</p></aside></div></div><section class="wrap preview-story"><div class="story-panel"><span class="overline">Ciekawostka, która może Ci się przydać</span><h2>${esc(PREVIEWS[c.id]?.curiosity || c.short)}</h2><p><strong>Wyobraź sobie taką sytuację:</strong> ${esc(PREVIEWS[c.id]?.scenario || 'Codzienność stawia przed nami wybory. Zamiast odgadywać cudze oczekiwania, sprawdź, co naprawdę pomaga.')}</p></div><div class="story-outcomes"><h3>Co przećwiczysz w praktyce?</h3>${[PREVIEWS[c.id]?.outcome_1,PREVIEWS[c.id]?.outcome_2,PREVIEWS[c.id]?.outcome_3].filter(Boolean).map(x=>`<div class="story-outcome"><span aria-hidden="true">✓</span>${esc(x)}</div>`).join('')}<p class="story-foot">Nie obiecujemy idealnego życia po jednym kursie. Pokazujemy sytuacje, pytania i małe kroki, które możesz dopasować do siebie.</p></div></section>${keyboardTeaserHTML(c)}${PREVIEWS[c.id]?.history?`<section class="wrap craft-history"><div class="story-history"><div class="overline">Rzemiosło dawniej i dziś</div><h2>Jak pracowali dawni mistrzowie?</h2><p>Warsztat, narzędzia i cierpliwość — te umiejętności przez pokolenia przekazywano w praktyce. Wiele z nich nadal żyje w małych pracowniach i warsztatach.</p><p>Na lekcjach poznasz materiał, narzędzia i budowę charakterystycznego wyrobu. Następnie spróbujesz zrozumieć, dlaczego rzemieślnik wybierał właśnie taki sposób pracy.</p></div></section>`:""}${c.cat==="Języki na budowie"?`<section class="wrap language-intro-art"><img src="/academy/illustrations/wejscie.svg" alt="Autorska ilustracja pierwszego dnia pracy na budowie — od bramy do wprowadzenia" loading="lazy" /><div><span class="overline">Od pierwszego słowa</span><h2>Nie znasz języka? Właśnie od tego zaczynamy.</h2><p>Posłuchasz krótkich zwrotów, poznasz litery, zapytasz o wejście i bezpieczną pracę. Każdy kraj ma własne zasady i własne instytucje. Uczysz się od pierwszego dnia aż po zakończenie zmiany.</p></div></section>`:""}<section class="wrap course-syllabus"><div class="syllabus-intro"><div class="overline">Program kursu</div><h2>Sprawdź, czego się nauczysz.</h2><p>${c.outline?.length||8} lekcji z przykładami i zadaniami. Wybierz lekcję, poznaj temat i sprawdź nowe umiejętności na konkretnych sytuacjach.</p></div><div class="syllabus-grid">${(Array.isArray(c.outline)&&c.outline.length?c.outline:['Wprowadzenie i cele','Najważniejsze zasady','Zastosowanie w praktyce','Ćwiczenia na przykładach','Najczęstsze błędy','Trudniejsze sytuacje','Samodzielne zadanie','Podsumowanie i sprawdzenie wiedzy']).map((title,i)=>`<div class="syllabus-item"><span>0${i+1}</span><b>${esc(title)}</b></div>`).join('')}</div><button class="btn btn-dark" style="margin:23px 0 18px" onclick="openCheckout()">${c.price===0?'Odbierz darmowy kurs':'Kup kurs — '+money(c.price)} →</button></section>${hasAccess(c.id)?`<section class="learn-area scrolltop" id="learn-area"><div class="wrap learn-layout"><aside class="sidebar"><div class="side-title">TWOJA DROGA DO UMIEJĘTNOŚCI</div><div class="progress-head"><span>Etapy praktyki</span><span>${st.done.length}/8</span></div><div class="progressbar"><i style="width:${st.done.length*12.5}%"></i></div>${c.modules.map((m,i)=>`<button class="module-btn ${selectedStep===i&&['lesson','quiz'].includes(mode)?'sel':''} ${st.done.includes(i)?'done':''}" ${i>st.done.length?'disabled':''} onclick="jumpStep(${i})"><span class="num">${st.done.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><span><span class="mod-name">${esc(m[0])}</span><small class="mod-sub">${st.done.includes(i)?'Zaliczony':'Nauka, ćwiczenie i quiz'}</small></span></button>`).join('')}<button class="module-btn ${mode==='roleplay'?'sel':''}" ${st.done.length<8?'disabled':''} onclick="roleplayStart()"><span class="num">☺</span><span><span class="mod-name">Rozmowa z Trenerką</span><small class="mod-sub">5 pytań • 5 minut</small></span></button><button class="module-btn ${mode==='exam'?'sel':''}" ${st.done.length<8||!st.roleplayDone?'disabled':''} onclick="startExam()"><span class="num">★</span><span><span class="mod-name">Egzamin końcowy</span><small class="mod-sub">16 losowanych pytań</small></span></button>${st.passed?`<button class="module-btn ${mode==='cert'?'sel':''}" onclick="showCert()"><span class="num">🏆</span><span><span class="mod-name">Certyfikat PL / EN</span><small class="mod-sub">Przykładowy dokument</small></span></button>`:''}</aside><section class="lesson" id="lesson-view">${mode==='roleplay'?roleplayHTML():mode==='exam'?examHTML():mode==='cert'?certHTML():lessonHTML()}</section></div></section>${coachWidget()}`:`<section class="wrap"><div class="lock-card"><div class="overline">Nauka po zakupie</div><h2>Twój kurs czeka na Ciebie</h2><p>Po aktywacji dostępu zobaczysz lekcje i praktyczne ćwiczenia z możliwością zapisywania postępu. Testy, egzamin i potwierdzenia ukończenia są w przygotowaniu. Dostęp demonstracyjny trwa 14 dni.</p><button class="btn btn-dark" onclick="openCheckout()">Kup kurs</button><p class="tiny-muted">Nie pobieramy jeszcze pieniędzy. Dostęp testowy do płatnych kursów jest wyłącznie dla administratora.</p></div></section>`}`;}

function render(){const app=$('#app');app.innerHTML=page==='home'?homeHTML():courseHTML();if(page==='home')updateCatalog();document.title=page==='home'?'TRENERKI Academy — Kursy praktyczne i umiejętności':selectedCourse.title+' — TRENERKI Academy';}
function openCheckout(){const code=selectedCourse?.id;if(code)startPurchase(code);else window.location.assign('/konto');}
function openLibrary(e){if(e)e.preventDefault();window.location.assign('/moje-kursy');}
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#modal-root').innerHTML='';});
window.addEventListener('popstate',()=>{
 const slug=new URLSearchParams(window.location.search).get('course');
 if(slug&&COURSES.some(c=>c.id===slug))openCourse(slug,false);
 else goHome(null,null,false);
});
const initialCourse=new URLSearchParams(window.location.search).get('course');
if(initialCourse&&COURSES.some(c=>c.id===initialCourse))openCourse(initialCourse,false);
else render();

const _catalogEndpoint='https://kcvvixcjuwglfvdpypzs.supabase.co/rest/v1/ta_courses?select=slug,title_pl,description_pl,price_grosze&published=eq.true';
fetch(_catalogEndpoint,{headers:{apikey:'sb_publishable_wpRp2JuWNW_WcjZdWXwIRQ_HfCPlxrj',accept:'application/json'}})
 .then(async res=>{if(!res.ok)throw new Error('catalog_fetch_failed');return res.json()})
 .then(rows=>{
  if(!Array.isArray(rows))return;
  const bySlug=new Map(rows.map(row=>[row.slug,row]));
  for(const c of COURSES){
   const row=bySlug.get(c.id);
   if(!row)continue;
   if(typeof row.title_pl==='string'&&row.title_pl.trim())c.title=row.title_pl;
   if(typeof row.description_pl==='string'&&row.description_pl.trim())c.short=row.description_pl;
   if(Number.isInteger(row.price_grosze)&&row.price_grosze>=0)c.price=row.price_grosze/100;
  }
  if(page==='home')updateCatalog();
  else if(selectedCourse)render();
 })
 .catch(()=>{}); // Render original course catalog as a safe fallback during outages.

</script>
