<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zaufany wolontariusz · Materiały kursu | TRENERKI</title>
<style>
body{margin:0;background:#f3f5f0;color:#172d25;font:1rem/1.6 system-ui,sans-serif}
main,footer{max-width:40rem;margin:auto;padding:2rem 1.25rem}a{color:#16523b}
</style>
</head>
<body>
<main>
<h1>Zaufany wolontariusz</h1>
<p>Materiały kursu otworzysz po zalogowaniu i bezpłatnym zapisie.</p>
<p><a href="/materialy-wolontariusza">Przejdź do materiałów kursu</a></p>
</main>
<footer><a href="/pomoc">Bezpłatna pomoc i wsparcie</a></footer>
<script>
const section = location.hash.slice(1);
const materialSections = new Set(['karty', 'test-zbiorek', 'sprawdzian', 'zrodla']);
const lesson = /^l(0[1-9]|[1-3][0-9]|40)$/.exec(section);
if (lesson) {
  location.replace('/nauka?course=zaufany-wolontariusz&lesson=' + Number(lesson[1]));
} else {
  location.replace('/materialy-wolontariusza' + (materialSections.has(section) ? '?sekcja=' + section : ''));
}
</script>
</body>
</html>
