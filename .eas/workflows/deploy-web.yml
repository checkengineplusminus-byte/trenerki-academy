name: TRENERKI Academy — deploy website
on:
  push:
    branches: ['main']
jobs:
  deploy_web:
    name: Publish Expo website
    type: deploy
    environment: production
    params:
      prod: true
    hooks:
      after_install_node_modules:
        - name: Protect minimum thirty chapters per course
          run: node scripts/audit-course-standards.mjs --enforce
        - name: Verify content, exercises and protected course access
          run: node scripts/check-content-consistency.mjs
        - name: Verify course finding with Anielka
          run: node scripts/test-anielka.mjs
        - name: Verify meaning and uniqueness of all 80 icons
          run: node scripts/test-course-icons.mjs
        - name: Sprawdz obliczenia i import pracowni ksiegowej
          run: node --experimental-default-type=module --test scripts/test-accounting-lab.mjs
        - name: Sprawdz odpowiedzi i szkice czytnika ksiegowosci
          run: node --experimental-default-type=module --test scripts/test-accounting-reader.mjs
